<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Ave Mujica乱斗</title>
  <style>
:root {
  --bg: #07090f;
  --panel: #121826;
  --line: rgba(255, 255, 255, 0.08);
  --text: #eef2ff;
  --muted: #93a0bb;
  --accent: #c4b5fd;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  position: fixed;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  min-height: 0;
  transform-origin: top left;
}

.hidden {
  display: none !important;
}

.screen {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 0;
}

#menu {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  padding: 6px 10px 8px;
  overflow: hidden;
}

.menu-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.12), transparent 28%),
    radial-gradient(circle at 80% 10%, rgba(251, 146, 60, 0.12), transparent 26%),
    radial-gradient(circle at 50% 90%, rgba(167, 139, 250, 0.14), transparent 32%),
    linear-gradient(180deg, #0b1020, #07090f 70%);
  pointer-events: none;
}

.title-wrap {
  text-align: center;
  z-index: 1;
}

.kicker,
.subtitle,
.hint {
  display: none;
}

h1 {
  font-size: 18px;
  letter-spacing: 0.08em;
  line-height: 1.1;
  text-shadow: 0 0 28px rgba(125, 211, 252, 0.35);
}

.select-grid {
  z-index: 1;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 8px;
  width: 100%;
  max-width: 1180px;
  align-items: stretch;
  flex: 1 1 auto;
  min-height: 0;
}

.side-panel {
  display: flex;
  flex-direction: column;
  background: rgba(18, 24, 38, 0.78);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 6px 8px;
  backdrop-filter: blur(10px);
  min-width: 0;
  min-height: 0;
}

.side-panel h2 {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 4px;
  flex: 0 0 auto;
}

.cards {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 5px;
  flex: 0 0 auto;
}

.card {
  border: 1px solid var(--line);
  background: #0d1320;
  color: var(--text);
  border-radius: 8px;
  padding: 4px 3px 5px;
  cursor: pointer;
  min-height: 0;
  min-width: 0;
}

.card:hover {
  transform: none;
}

.card.selected {
  border-color: var(--card-color, var(--accent));
  box-shadow: 0 0 0 1px var(--card-color);
}

.card .cface {
  width: 100%;
  height: 40px;
  border-radius: 6px;
  margin: 0 auto 3px;
  object-fit: contain;
  object-position: center top;
  background: #0a0f1a;
  display: block;
  pointer-events: none;
}

.card .cface-empty {
  width: 100%;
  height: 40px;
  border-radius: 6px;
  margin: 0 auto 3px;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 50% 40%, var(--card-color), transparent 62%),
    #0a0f1a;
  color: rgba(255, 255, 255, 0.7);
  font-size: 11px;
  pointer-events: none;
}

.card .cname {
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card .cskill {
  display: none;
}

.preview {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1 1 auto;
  min-height: 0;
  margin-top: 6px;
  border-radius: 8px;
  background: #0a0f1a;
  border: 1px solid var(--line);
  padding: 6px 8px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.35;
  overflow: hidden;
}

.preview .pskills {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
}

.preview-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex: 0 0 auto;
}

.preview strong {
  color: var(--text);
  font-size: 15px;
}

.preview .ptag {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: #93c5fd;
}

.preview .pstats {
  margin: 0;
  padding: 3px 6px;
  border-radius: 6px;
  background: rgba(125, 211, 252, 0.08);
  color: #e2e8f0;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
  flex: 0 0 auto;
}

.preview .pstats b {
  color: #7dd3fc;
  font-weight: 800;
}

.preview .skill-line {
  margin-top: 0;
  display: grid;
  grid-template-columns: 5em 2.6em minmax(0, 1fr);
  gap: 4px 6px;
  align-items: start;
  font-size: 11px;
}

.preview .phint {
  min-width: 0;
  color: #cbd5e1;
}

.preview.detailed .skill-line {
  grid-template-columns: minmax(4em, auto) 2.6em;
  padding: 3px 0 5px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.preview.detailed .phint {
  grid-column: 1 / -1;
  line-height: 1.45;
  color: #dbe4f5;
}

.preview.detailed .pstats {
  line-height: 1.5;
}

.preview .skill-line b {
  color: #eef2ff;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.preview .scd {
  font-size: 11px;
  color: #fbbf24;
  font-variant-numeric: tabular-nums;
}

.preview .ult {
  color: #fde68a;
}

.preview .ult b {
  color: #fbbf24;
}

.vs-badge {
  align-self: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 13px;
  background: #1b2436;
  border: 1px solid var(--line);
}

.menu-actions {
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px 18px;
  flex: 0 0 auto;
  width: 100%;
}

.difficulty-row {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
}

.diff-btns {
  display: flex;
  gap: 6px;
}

.diff-btns button, .start-btn, .overlay button {
  border: 0;
  cursor: pointer;
  font: inherit;
}

.menu-start-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}

.diff-btns button {
  background: #151c2c;
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 12px;
}

.diff-btns button.selected {
  background: #1e3a4c;
  border-color: var(--accent);
  color: var(--accent);
}

.desc-toggle {
  background: #151c2c;
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 12px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}

.desc-toggle.on {
  background: #1e3a4c;
  border-color: var(--accent);
  color: var(--accent);
}

.start-btn {
  background: linear-gradient(90deg, #22d3ee, #818cf8);
  color: #061018;
  font-weight: 800;
  font-size: 16px;
  letter-spacing: 0.18em;
  border-radius: 999px;
  padding: 8px 28px;
  box-shadow: 0 10px 30px rgba(34, 211, 238, 0.25);
}

.start-btn:hover {
  transform: translateY(-1px);
}

.start-btn.alt {
  background: linear-gradient(90deg, #f59e0b, #f472b6);
  font-size: 14px;
  letter-spacing: 0.1em;
  padding: 8px 18px;
  box-shadow: 0 10px 30px rgba(244, 114, 182, 0.22);
}

.start-btn.ghost {
  background: linear-gradient(90deg, #34d399, #22d3ee);
  font-size: 14px;
  letter-spacing: 0.1em;
  padding: 8px 18px;
  box-shadow: 0 10px 30px rgba(52, 211, 153, 0.22);
}

.hint {
  color: var(--muted);
  font-size: 13px;
}

#battle {
  display: flex;
  flex-direction: column;
  position: relative;
  background: #6aa0d8;
  overflow: hidden;
}

.arena-wrap {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0;
  overflow: hidden;
  background: #6aa0d8;
}

#arena {
  display: block;
  background: #6aa0d8;
}

#pause-btn {
  position: absolute;
  top: 8px;
  right: max(10px, env(safe-area-inset-right));
  z-index: 7;
  border: 1px solid rgba(255, 255, 255, 0.35);
  background: rgba(0, 0, 0, 0.28);
  color: #e2e8f0;
  font: inherit;
  font-size: 13px;
  letter-spacing: 0.08em;
  border-radius: 999px;
  padding: 6px 14px;
}

.act-btn.ult .cd-mask {
  background: rgba(250, 204, 21, 0.5);
}

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(32, 48, 72, 0.62);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.overlay h2 {
  font-size: 56px;
}

.overlay button {
  min-width: 180px;
  padding: 12px 20px;
  border-radius: 12px;
  background: #eef2ff;
  color: #111827;
  font-weight: 700;
}

.overlay button[data-menu] {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255, 255, 255, 0.16);
}

#result-kicker {
  letter-spacing: 0.4em;
  color: #f87171;
}

.touch-pad {
  display: block;
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background: none;
}

.stick-zone {
  pointer-events: auto;
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 46%;
}

.stick {
  position: absolute;
  left: 88px;
  bottom: 72px;
  width: 132px;
  height: 132px;
  margin: 0;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.28);
  background: rgba(255, 255, 255, 0.08);
  transform: translate(-50%, 50%);
  pointer-events: none;
}

.stick-knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 58px;
  height: 58px;
  margin: -29px 0 0 -29px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.42);
  border: 2px solid rgba(255, 255, 255, 0.55);
}

.skill-wheel {
  pointer-events: auto;
  position: absolute;
  right: max(10px, env(safe-area-inset-right));
  bottom: calc(10px + env(safe-area-inset-bottom));
  width: 248px;
  height: 248px;
}

.act-btn {
  position: absolute;
  overflow: hidden;
  width: 72px;
  height: 72px;
  border: 2px solid rgba(255, 255, 255, 0.5);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
  font-weight: 800;
  font-size: 13px;
  line-height: 1.15;
  padding: 4px;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.act-btn[data-slot="s0"] { right: 126px; bottom: 10px; }
.act-btn[data-slot="s1"] { right: 158px; bottom: 86px; }
.act-btn[data-slot="s2"] { right: 96px; bottom: 154px; }
.act-btn[data-slot="ult"] {
  right: 18px;
  bottom: 154px;
  width: 76px;
  height: 76px;
}
.act-btn[data-slot="punch"] {
  right: 8px;
  bottom: 8px;
  width: 108px;
  height: 108px;
  font-size: 20px;
}

.act-btn .sname {
  position: relative;
  z-index: 1;
  display: block;
  pointer-events: none;
  word-break: break-all;
  font-size: 12px;
}

.act-btn[data-slot="punch"] .sname { font-size: 16px; }

.act-btn .cd-mask {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 0;
  background: rgba(0, 0, 0, 0.42);
  pointer-events: none;
}

.act-btn .cd-num {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 900;
  color: #fbbf24;
  text-shadow: 0 1px 8px #000;
  pointer-events: none;
  z-index: 2;
}

.act-btn.ready {
  border-color: rgba(34, 211, 238, 0.95);
  background: rgba(34, 211, 238, 0.18);
  color: #fff;
  box-shadow: 0 0 16px rgba(34, 211, 238, 0.35);
}

.act-btn.cooling {
  border-color: rgba(245, 158, 11, 0.9);
  background: rgba(255, 255, 255, 0.08);
  color: rgba(255, 255, 255, 0.7);
  box-shadow: none;
}

.act-btn.cooling .sname {
  opacity: 0.35;
}

.act-btn.ult.ready {
  border-color: rgba(250, 204, 21, 0.95);
  background: rgba(250, 204, 21, 0.2);
  color: #fff;
  box-shadow: 0 0 18px rgba(250, 204, 21, 0.4);
  animation: ult-ready 0.9s ease-in-out infinite;
}

@keyframes ult-ready {
  50% { transform: scale(1.04); }
}

.act-btn:active {
  transform: scale(0.94);
  background: rgba(255, 255, 255, 0.28);
}

.desktop-only {
  display: none;
}

.pc-controls {
  position: absolute;
  left: 50%;
  bottom: 12px;
  z-index: 4;
  transform: translateX(-50%);
  align-items: center;
  gap: 12px;
  padding: 7px 12px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 10px;
  background: rgba(5, 9, 18, 0.7);
  color: rgba(255, 255, 255, 0.78);
  font-size: 12px;
  white-space: nowrap;
  pointer-events: none;
  backdrop-filter: blur(6px);
}

.pc-controls kbd {
  display: inline-block;
  min-width: 22px;
  margin-right: 3px;
  padding: 2px 5px;
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-bottom-width: 2px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  font: 700 11px/1.2 "Segoe UI", sans-serif;
  text-align: center;
}

@media (hover: hover) and (pointer: fine) {
  .desktop-only { display: flex; }
  .mobile-only { display: none; }

  .act-btn::after {
    content: attr(data-key-label);
    position: absolute;
    right: 5px;
    top: 4px;
    z-index: 3;
    min-width: 18px;
    padding: 2px 4px;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    font-size: 10px;
    line-height: 1;
  }
}

</style>
</head>
<body>
  <div id="app">
    <section id="menu" class="screen">
      <div class="menu-bg"></div>
      <header class="title-wrap">
        <p class="kicker">AVE MUJICA</p>
        <h1>Ave Mujica乱斗</h1>
        <p class="subtitle">横屏对战 · 手机与电脑均可操作</p>
      </header>

      <div class="select-grid">
        <div class="side-panel">
          <h2>你的角色</h2>
          <div id="player-cards" class="cards"></div>
          <div id="player-preview" class="preview"></div>
        </div>
        <div class="vs-badge">VS</div>
        <div class="side-panel">
          <h2>电脑角色</h2>
          <div id="cpu-cards" class="cards"></div>
          <div id="cpu-preview" class="preview"></div>
        </div>
      </div>

      <div class="menu-actions">
        <div class="difficulty-row">
          <span>电脑难度</span>
          <div id="diff-btns" class="diff-btns"></div>
        </div>
        <button type="button" id="desc-toggle" class="desc-toggle">详细数值</button>
        <div class="menu-start-row">
          <button id="start-btn" class="start-btn">开战</button>
          <button id="watch-btn" class="start-btn alt" type="button">电脑观战</button>
          <button id="cycle-btn" class="start-btn ghost" type="button">循环观战</button>
        </div>
      </div>
      <p class="hint mobile-only">把手机侧过来拿（充电口朝右），画面已固定成横屏</p>
      <p class="hint desktop-only">电脑：WASD / 方向键移动，J 普攻，K/U/I 技能，L 大招。电脑观战让双方都由 AI 打；循环观战会轮换全部对阵。</p>
    </section>

    <section id="battle" class="screen hidden">
      <button id="pause-btn" type="button">暂停</button>
      <div class="arena-wrap">
        <canvas id="arena" width="1280" height="720"></canvas>
      </div>
      <div id="touch-pad" class="touch-pad">
        <div id="stick-zone" class="stick-zone">
          <div id="stick" class="stick">
            <div id="stick-knob" class="stick-knob"></div>
          </div>
        </div>
        <div class="skill-wheel">
          <button type="button" class="act-btn" data-press="KeyK" data-key-label="K" data-slot="s0">
            <span class="sname">技能</span>
            <span class="cd-mask"></span>
            <span class="cd-num"></span>
          </button>
          <button type="button" class="act-btn" data-press="KeyU" data-key-label="U" data-slot="s1">
            <span class="sname">技能</span>
            <span class="cd-mask"></span>
            <span class="cd-num"></span>
          </button>
          <button type="button" class="act-btn" data-press="KeyI" data-key-label="I" data-slot="s2">
            <span class="sname">技能</span>
            <span class="cd-mask"></span>
            <span class="cd-num"></span>
          </button>
          <button type="button" class="act-btn ult" data-press="KeyL" data-key-label="L" data-slot="ult">
            <span class="sname">大招</span>
            <span class="cd-mask"></span>
            <span class="cd-num"></span>
          </button>
          <button type="button" class="act-btn punch ready" data-press="KeyJ" data-key-label="J" data-slot="punch">
            <span class="sname">普攻</span>
          </button>
        </div>
      </div>
      <div id="pc-controls" class="pc-controls desktop-only" aria-hidden="true">
        <span><kbd>A D</kbd>移动</span>
        <span><kbd>W</kbd>/<kbd>Space</kbd>跳跃</span>
        <span><kbd>J</kbd>普攻</span>
        <span><kbd>K U I</kbd>技能</span>
        <span><kbd>L</kbd>大招</span>
        <span><kbd>Esc</kbd>暂停</span>
      </div>
      <div id="pause" class="overlay hidden">
        <h2>暂停</h2>
        <button data-resume>继续</button>
        <button data-menu>返回选人</button>
      </div>
      <div id="result" class="overlay hidden">
        <p id="result-kicker">K.O.</p>
        <h2 id="result-title">胜利</h2>
        <p id="result-sub"></p>
        <button data-rematch>再来一局</button>
        <button data-menu>返回选人</button>
      </div>
    </section>
  </div>
  <script>
(() => {
  const CANVAS_W = 1280;
  const CANVAS_H = 720;
  const GROUND = 602;
  const SIZE = 1.5;
  const GRAVITY = 0.82;
  const LEFT_WALL = 70;
  const RIGHT_WALL = 1210;
  const MAX_MP = 200;
  const SKILL_DAMAGE_SCALE = 2.1;
  const ULT_DAMAGE_SCALE = 2;

  const CHARACTERS = [
    {
      id: "gale",
      name: "睦",
      color: "#c5e0d0",
      accent: "#f8fafc",
      thick: 3.6,
      hp: 600,
      speed: 5.15,
      jump: 14,
      airJumps: 0,
      skillDmg: 1.02,
      skillCd: 1.02,

  function fitCanvas() {
    const wrap = canvas.parentElement;
    if (!wrap) return;
    const rw = wrap.clientWidth;
    const rh = wrap.clientHeight;
    if (rw < 2 || rh < 2) return;
    const scale = Math.max(rw / CANVAS_W, rh / CANVAS_H);
    canvas.style.width = `${Math.max(1, Math.floor(CANVAS_W * scale))}px`;

  function hasPortrait(d) {
    const img = portraits[d && d.id];
    return !!(img && img.complete && img.naturalWidth);
  }

  function setPortrait(id, src) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        portraits[id] = img;
        portraitStore[id] = src;
        resolve(true);
      };
      img.onerror = () => resolve(false);
      img.src = src;
    });
  }

  function savePortraits() {
    try {
      localStorage.setItem(PORTRAIT_KEY, JSON.stringify(portraitStore));
    } catch (err) {
      console.warn(err);
    }
  }

  async function loadPortraits() {
    try {
      Object.assign(portraitStore, JSON.parse(localStorage.getItem(PORTRAIT_KEY) || "{}"));
    } catch (e) {}
    await Promise.all(CHARACTERS.map(async (c) => {
      const stored = portraitStore[c.id];
      if (stored && String(stored).startsWith("data:") && await setPortrait(c.id, stored)) return;
      if (EMBEDDED_FACES[c.id] && await setPortrait(c.id, EMBEDDED_FACES[c.id])) return;
      if (await setPortrait(c.id, `faces/${c.id}.png`)) return;
    }));
  }

  function compressPortraitFile(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const max = 360;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(img.width * scale));
        cv.height = Math.max(1, Math.round(img.height * scale));
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL("image/jpeg", 0.88));
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error("bad image"));
      };
      img.src = url;
    });
  }

  function pickPortrait(id) {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.onchange = async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const data = await compressPortraitFile(file);
      await setPortrait(id, data);
      savePortraits();
      renderMenu();
    };
    input.click();
  }

  function beep(freq, dur, type, vol, slideTo) {
    try {
      const ac = ensureAudio();
      const t = ac.currentTime;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(Math.max(20, freq), t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur * 0.85);
      g.gain.setValueAtTime(vol || 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t);
      o.stop(t + dur + 0.02);
    } catch {
      /* ignore */
    }
  }

  function ensureAudio() {
    if (!audio.ctx) audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
    return audio.ctx;
  }

  function noiseBurst(dur, vol, freq, type) {
    try {
      const ac = ensureAudio();
      const n = Math.max(1, Math.floor(ac.sampleRate * dur));
      const buf = ac.createBuffer(1, n, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < n; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = ac.createBufferSource();
      src.buffer = buf;
      const filter = ac.createBiquadFilter();
      filter.type = type || "lowpass";
      filter.frequency.value = freq || 900;
      filter.Q.value = 0.7;
      const g = ac.createGain();
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      src.connect(filter).connect(g).connect(ac.destination);
      src.start();
    } catch {
      /* ignore */
    }
  }

  function playSfx(id) {
    if (!id || id === "none") return;
    const fn = SFX[id];
    if (fn) fn();
  }

  function impactSound(hit) {
    if (!hit.sfx || hit.sfx === "none") return;
    if (SFX[`${hit.sfx}_hit`]) playSfx(`${hit.sfx}_hit`);
    else playSfx(hit.sfx);
  }

  function burst(x, y, color, n, speed) {
    if (headless) return;
    const count = Math.min(n, MAX_PARTICLES - particles.length);
    for (let i = 0; i < count; i += 1) {
      const a = Math.random() * Math.PI * 2;
      const s = (Math.random() * 0.7 + 0.3) * (speed || 5);
      addParticle({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 1.4,
        life: 18 + Math.random() * 16,
        max: 34,
        size: 2 + Math.random() * 3,
        color,
      });
    }
  }

  function visRand(seed) {
    const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
    return x - Math.floor(x);
  }

  function drawLightningBolt(x0, y0, x1, y1, seed, color) {
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const segs = 9;
    const strokeBolt = (offset, width, alpha, stroke) => {
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      for (let i = 1; i < segs; i += 1) {
        const u = i / segs;
        const j = (visRand(seed * 19 + i * 7 + offset) - 0.5) * 46;
        ctx.lineTo(x0 + (x1 - x0) * u + j, y0 + (y1 - y0) * u + (visRand(seed + i) - 0.5) * 10);
      }
      ctx.lineTo(x1, y1);
      ctx.strokeStyle = stroke;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = width;
      ctx.stroke();
    };
    ctx.shadowColor = color;
    ctx.shadowBlur = 32;
    strokeBolt(0, 14, 0.28, color);
    strokeBolt(0, 7, 0.7, color);
    ctx.shadowBlur = 14;
    strokeBolt(1, 2.6, 1, "#ffffff");
    const midU = 0.42 + visRand(seed + 3) * 0.2;
    const mx = x0 + (x1 - x0) * midU;
    const my = y0 + (y1 - y0) * midU;
    ctx.beginPath();
    ctx.moveTo(mx, my);
    ctx.lineTo(mx + (visRand(seed + 11) - 0.5) * 90, my + 24 + visRand(seed + 12) * 54);
    ctx.strokeStyle = "#f0fdf4";
    ctx.lineWidth = 1.8;
    ctx.globalAlpha = 0.85;
    ctx.stroke();
    ctx.restore();
  }

  function drawMiniBolt(c, x0, y0, x1, y1, seed, color) {
    c.save();
    c.lineCap = "round";
    c.lineJoin = "round";
    const segs = 5;
    const stroke = (offset, width, alpha, col) => {
      c.beginPath();
      c.moveTo(x0, y0);
      for (let i = 1; i < segs; i += 1) {
        const u = i / segs;
        const j = (visRand(seed * 11 + i * 5 + offset) - 0.5) * 9;
        c.lineTo(x0 + (x1 - x0) * u + j, y0 + (y1 - y0) * u + (visRand(seed + i + offset) - 0.5) * 5);
      }
      c.lineTo(x1, y1);
      c.strokeStyle = col;
      c.globalAlpha = alpha;
      c.lineWidth = width;
      c.stroke();
    };
    c.shadowColor = color;
    c.shadowBlur = 10;
    stroke(0, 3.4, 0.35, color);
    stroke(0, 1.6, 0.9, color);
    stroke(1, 0.8, 1, "#ffffff");
    c.restore();
  }

  function drawMusicNote(c, x, y, scale, color, alpha) {
    c.save();
    c.translate(x, y);
    c.scale(scale, scale);
    c.globalAlpha = alpha == null ? 1 : alpha;
    c.fillStyle = color;
    c.shadowColor = color;
    c.shadowBlur = 16;
    c.beginPath();
    c.ellipse(0, 10, 10, 7.2, -0.45, 0, Math.PI * 2);
    c.fill();
    c.fillRect(7.2, -26, 3.6, 36);
    c.beginPath();
    c.moveTo(10.8, -26);
    c.bezierCurveTo(28, -22, 30, -4, 16, 4);
    c.bezierCurveTo(24, -6, 20, -18, 10.8, -20);
    c.fill();
    c.restore();
  }

  function drawHeartShape(x, y, size, color, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size / 10, size / 10);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, 3.2);
    ctx.bezierCurveTo(-9, -4.5, -5.5, -11, 0, -7.2);
    ctx.bezierCurveTo(5.5, -11, 9, -4.5, 0, 3.2);
    ctx.fill();
    ctx.restore();
  }

  function drawSkillFx(f) {
    if (!f || f.dead) return;
    const move = String(f.skillMove || "");
    const t = f.stateT || 0;
    const seed = (f.anim || 0) * 0.13 + t * 1.7 + f.x * 0.01;

    if (move === "gale_ult") {
      const striking = (t >= 8 && t <= 15) || (t >= 18 && t <= 25) || (t >= 28 && t <= 37);
      const flash = t === 8 || t === 18 || t === 28 || t === 9 || t === 19 || t === 29;
      if (striking) {
        const hitX = f.x + f.facing * 48;
        drawLightningBolt(hitX + (visRand(seed) - 0.5) * 24, 18, hitX + f.facing * 10, f.y - 8, seed, "#bbf7d0");
        if (t >= 28) drawLightningBolt(hitX - 36, 8, hitX + 18, f.y, seed + 4, "#e0f2fe");
        ctx.save();
        const glow = ctx.createRadialGradient(hitX, f.y - 40, 8, hitX, f.y - 40, flash ? 160 : 90);
        glow.addColorStop(0, flash ? "rgba(255,255,255,0.55)" : "rgba(187,247,208,0.28)");
        glow.addColorStop(0.45, "rgba(134,239,172,0.12)");
        glow.addColorStop(1, "rgba(134,239,172,0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(hitX, f.y - 40, flash ? 160 : 90, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      } else if (t < 8) {
        ctx.save();
        ctx.globalAlpha = 0.35 + t * 0.04;
        ctx.strokeStyle = "#bbf7d0";
        ctx.shadowColor = "#86efac";
        ctx.shadowBlur = 18;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(f.x, 24);
        ctx.lineTo(f.x + (visRand(seed + t) - 0.5) * 12, f.y - 90);
        ctx.stroke();
        ctx.restore();
      }
    }

    if (f.id === "gale" && (move.startsWith("gale_") || f.state === "punch")) {
      const hx = f.x + f.facing * 42;
      const hy = f.y - 58;
      const tipX = hx + f.facing * 38;
      const tipY = hy - 28;
      drawMiniBolt(ctx, hx, hy, tipX, tipY, seed, "#bbf7d0");
      if (move === "gale_s2" || move === "gale_s0") {
        drawMiniBolt(ctx, hx + f.facing * 8, hy - 10, tipX + f.facing * 18, tipY + 16, seed + 3, "#e0f2fe");
      }
    }

    if (f.id === "iron") {
      if (move === "iron_s0") {
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.strokeStyle = "#fb7185";
        ctx.shadowColor = "#fda4af";
        ctx.shadowBlur = 24;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(f.x + f.facing * 26, f.y - 58, 22 + (t % 6), 0.15, Math.PI - 0.15);
        ctx.stroke();
        ctx.restore();
        if (t >= 10 && t <= 18) {
          ctx.save();
          ctx.fillStyle = "rgba(251,113,133,0.12)";
          ctx.shadowColor = "#fff";
          ctx.shadowBlur = 18;
          ctx.fillRect(f.x - 56, f.y - 128, 112, 136);
          ctx.strokeStyle = "#fff1f2";
          ctx.lineWidth = 4;
          ctx.strokeRect(f.x - 56, f.y - 128, 112, 136);
          ctx.setLineDash([7, 5]);
          ctx.strokeStyle = "#fb7185";
          ctx.lineWidth = 2.2;
          ctx.strokeRect(f.x - 44, f.y - 116, 88, 112);
          ctx.restore();
          for (let i = 0; i < 12; i += 1) {
            const u = visRand(seed + i * 5);
            drawHeartShape(f.x + (u - 0.5) * 110, f.y - 70 - (t - 10) * 4 - i * 7, 9 + u * 6, i % 2 ? "#fb7185" : "#fce7f3", 0.95);
          }
        }
      } else if (move === "iron_s1") {
        const aura = ctx.createRadialGradient(f.x, f.y - 48, 4, f.x, f.y - 48, 120);
        aura.addColorStop(0, "rgba(255,255,255,0.55)");
        aura.addColorStop(0.25, "rgba(251,113,133,0.5)");
        aura.addColorStop(1, "rgba(251,113,133,0)");
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(f.x, f.y - 48, 120, 0, Math.PI * 2);
        ctx.fill();
        ctx.save();
        ctx.strokeStyle = "#fff1f2";
        ctx.shadowColor = "#fb7185";
        ctx.shadowBlur = 16;
        ctx.lineWidth = 3.4;
        ctx.strokeRect(f.x - 52, f.y - 122, 104, 128);
        ctx.setLineDash([8, 6]);
        ctx.lineWidth = 1.8;
        ctx.strokeStyle = "#f9a8d4";
        ctx.strokeRect(f.x - 40, f.y - 110, 80, 104);
        ctx.restore();
        for (let i = 0; i < 16; i += 1) {
          const u = visRand(seed + i * 9);
          const rise = (t * 3.4 + i * 9) % 78;
          drawHeartShape(f.x + (u - 0.5) * 96, f.y - 12 - rise, 8 + u * 7, u > 0.5 ? "#fb7185" : "#fff1f2", 0.92);
        }
      } else if (move === "iron_s2") {
        ctx.save();
        const glow = ctx.createRadialGradient(f.x, f.y - 40, 6, f.x, f.y - 40, 90);
        glow.addColorStop(0, "rgba(252,231,243,0.45)");
        glow.addColorStop(1, "rgba(244,114,182,0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(f.x, f.y - 40, 90, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fce7f3";
        ctx.lineWidth = 4;
        ctx.shadowColor = "#fb7185";
        ctx.shadowBlur = 18;
        for (let i = 0; i < 7; i += 1) {
          const y = f.y - 12 - i * 14;
          ctx.globalAlpha = 0.9 - i * 0.1;
          ctx.beginPath();
          ctx.moveTo(f.x - f.facing * (18 + i * 14), y);
          ctx.lineTo(f.x - f.facing * (88 + i * 26), y + (i % 2 ? 10 : -10));
          ctx.stroke();
        }
        ctx.restore();
        for (let i = 0; i < 6; i += 1) {
          const u = visRand(seed + i * 3);
          drawHeartShape(f.x - f.facing * (24 + i * 16), f.y - 30 - u * 40, 7 + u * 5, "#fb7185", 0.9);
        }
      } else if (move === "iron_ult") {
        const slamming = (t >= 12 && t <= 18) || (t >= 24 && t <= 30) || (t >= 38 && t <= 46);
        const aura = ctx.createRadialGradient(f.x, f.y - 48, 8, f.x, f.y - 48, 130);
        aura.addColorStop(0, slamming ? "rgba(255,255,255,0.5)" : "rgba(251,113,133,0.28)");
        aura.addColorStop(1, "rgba(251,113,133,0)");
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(f.x, f.y - 48, 130, 0, Math.PI * 2);
        ctx.fill();
        for (let i = 0; i < 10; i += 1) {
          const u = visRand(seed + i * 8);
          drawHeartShape(f.x + (u - 0.5) * 100, f.y - 18 - ((t * 2 + i * 13) % 70), 8 + u * 6, u > 0.45 ? "#fb7185" : "#fce7f3", 0.88);
        }
        if (slamming) {
          ctx.save();
          ctx.globalAlpha = 0.9;
          ctx.strokeStyle = "#fff1f2";
          ctx.shadowColor = "#fb7185";
          ctx.shadowBlur = 28;
          ctx.lineWidth = 10;
          ctx.beginPath();
          ctx.arc(f.x + f.facing * 30, GROUND, 34 + (t % 8) * 8, Math.PI, 0);
          ctx.stroke();
          ctx.restore();
          for (let i = 0; i < 8; i += 1) {
            drawHeartShape(f.x + f.facing * 20 + (visRand(seed + i) - 0.5) * 80, GROUND - 28 - i * 14, 10, "#fb7185", 0.95);
          }
        }
      }
      if (f.armor > 24) {
        ctx.save();
        const pulse = 42 + Math.sin((f.anim || 0) * 0.28) * 8;
        ctx.strokeStyle = "rgba(255,241,242,0.85)";
        ctx.shadowColor = "#fb7185";
        ctx.shadowBlur = 20;
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.arc(f.x, f.y - 46, pulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 0.35;
        ctx.strokeStyle = "#f9a8d4";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(f.x, f.y - 46, pulse + 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        drawHeartShape(f.x, f.y - 108, 9, "#fb7185", 0.8);
      }
    }

    if (f.id === "shadow") {
      const facing = f.facing || 1;
      const hx = f.x;
      const hy = f.y - 52;
      ctx.save();
      ctx.lineCap = "round";
      if (move === "shadow_s0") {
        for (let i = 0; i < 6; i += 1) {
          ctx.globalAlpha = 0.55 - i * 0.07;
          ctx.strokeStyle = i % 2 ? "#fde68a" : "#bb9955";
          ctx.shadowColor = "#fbbf24";
          ctx.shadowBlur = 18;
          ctx.lineWidth = 3.2 - i * 0.3;
          ctx.beginPath();
          ctx.ellipse(hx - facing * i * 14, hy + 6, 20 + t * 1.4, 36 + i * 5, facing * 0.45, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.strokeStyle = "#fffbeb";
        ctx.lineWidth = 2;
        for (let i = 0; i < 6; i += 1) {
          const u = visRand(seed + i * 4);
          ctx.globalAlpha = 0.7;
          ctx.beginPath();
          ctx.moveTo(hx - facing * (12 + i * 10), hy - 30 + u * 50);
          ctx.lineTo(hx - facing * (48 + i * 16), hy - 30 + u * 50 + (u - 0.5) * 12);
          ctx.stroke();
        }
      } else if (move === "shadow_s2") {
        const copies = [
          { dx: -42, dy: 2, delay: 0 },
          { dx: 48, dy: -4, delay: 3 },
          { dx: 16, dy: -16, delay: 6 },
        ];
        for (let i = 0; i < copies.length; i += 1) {
          const copy = copies[i];
          const age = t - copy.delay;
          if (age < 0 || age > 16) continue;
          const alpha = age < 4 ? age / 4 * 0.48 : Math.max(0, 0.48 - (age - 4) / 16);
          if (alpha < 0.04) continue;
          const jitter = (visRand(seed + i * 7) - 0.5) * 6;
          drawFighter({
            def: f.def,
            id: f.id,
            x: f.x + f.facing * copy.dx + jitter,
            y: f.y + copy.dy,
            facing: f.facing,
            state: "skill",
            skillMove: "shadow_s2",
            stateT: f.stateT,
            anim: f.anim,
            ghostAlpha: alpha,
            invuln: 0,
            hitFlash: 0,
            dead: false,
          }, true);
        }
      }
      ctx.restore();
    }

    if (f.id === "pyro") {
      const facing = f.facing || 1;
      if (move === "pyro_s0") {
        ctx.save();
        const glow = ctx.createRadialGradient(f.x, f.y - 56, 8, f.x, f.y - 56, 72);
        glow.addColorStop(0, "rgba(219,231,247,0.32)");
        glow.addColorStop(0.55, "rgba(96,165,250,0.16)");
        glow.addColorStop(1, "rgba(249,168,212,0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(f.x, f.y - 56, 72, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      } else if (move === "pyro_s1") {
        ctx.save();
        const ring = 36 + t * 3.2;
        ctx.strokeStyle = "#fb923c";
        ctx.shadowColor = "#fdba74";
        ctx.shadowBlur = 18;
        ctx.lineWidth = 3.4;
        ctx.globalAlpha = 0.75;
        ctx.beginPath();
        ctx.arc(f.x, f.y - 58, ring, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 0.4;
        ctx.beginPath();
        ctx.arc(f.x, f.y - 58, ring * 0.62, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        for (let i = 0; i < 5; i += 1) {
          const u = visRand(seed + i * 6);
          drawMusicNote(ctx, f.x + facing * (18 + i * 10), f.y - 70 - u * 28, 1.35 + u * 0.5, i % 2 ? "#fb923c" : "#fff7ed", 0.85);
        }
      } else if (move === "pyro_s2") {
        ctx.save();
        ctx.translate(f.x + facing * 20, GROUND);
        ctx.scale(facing, 1);
        ctx.globalAlpha = 0.55;
        ctx.shadowColor = "#fb923c";
        ctx.shadowBlur = 26;
        const g = ctx.createLinearGradient(0, 0, 160, -70);
        g.addColorStop(0, "rgba(234,88,12,0.15)");
        g.addColorStop(0.5, "rgba(251,146,60,0.7)");
        g.addColorStop(1, "rgba(255,247,237,0.85)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(0, 4);
        ctx.quadraticCurveTo(48, -92, 110, -48);
        ctx.quadraticCurveTo(88, -18, 168, -8);
        ctx.lineTo(150, 4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        for (let i = 0; i < 4; i += 1) {
          drawMusicNote(ctx, f.x + facing * (36 + i * 28), GROUND - 36 - i * 10, 1.4, i % 2 ? "#fb923c" : "#fdba74", 0.7);
        }
      } else if (move === "pyro_ult") {
        const lock = f.lockX || f.x;
        ctx.save();
        const aura = ctx.createRadialGradient(lock, GROUND - 20, 10, lock, GROUND - 20, 150);
        aura.addColorStop(0, t < 6 ? "rgba(255,247,237,0.45)" : "rgba(251,146,60,0.22)");
        aura.addColorStop(1, "rgba(234,88,12,0)");
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(lock, GROUND - 20, 150, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fff7ed";
        ctx.shadowColor = "#fb923c";
        ctx.shadowBlur = 24;
        ctx.lineWidth = 5;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.arc(lock, GROUND, 78 + (t % 8) * 6, Math.PI, 0);
        ctx.stroke();
        ctx.setLineDash([10, 8]);
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(lock, 24);
        ctx.lineTo(lock, GROUND);
        ctx.stroke();
        ctx.restore();
        for (let i = 0; i < 6; i += 1) {
          const u = visRand(seed + i * 4);
          drawMusicNote(ctx, lock + (u - 0.5) * 120, GROUND - 40 - ((t * 4 + i * 16) % 90), 1.6 + u * 0.6, u > 0.5 ? "#fb923c" : "#fff7ed", 0.88);
        }
      }
    }

    if (f.id === "bastion") {
      const facing = f.facing || 1;
      if (move === "bastion_s0") {
        const slamming = t >= 10 && t <= 18;
        ctx.save();
        ctx.strokeStyle = slamming ? "#e0f2fe" : "#67e8f9";
        ctx.shadowColor = "#22d3ee";
        ctx.shadowBlur = slamming ? 22 : 10;
        ctx.translate(f.x + facing * 36, GROUND);
        for (let i = 0; i < 4; i += 1) {
          ctx.globalAlpha = slamming ? 0.8 - i * 0.16 : 0.22;
          ctx.lineWidth = 5 - i;
          ctx.beginPath();
          ctx.moveTo(facing * i * 18, 0);
          ctx.lineTo(facing * (28 + i * 22), -46 - i * 8);
          ctx.lineTo(facing * (52 + i * 26), 0);
          ctx.stroke();
        }
        ctx.restore();
      } else if (move === "bastion_s1") {
        const charge = Math.min(1, t / 40);
        const boom = t >= 40 && t <= 46;
        ctx.save();
        ctx.translate(f.x, f.y - 48);
        const aura = ctx.createRadialGradient(0, 0, 8, 0, 0, boom ? 150 : 40 + charge * 70);
        aura.addColorStop(0, boom ? "rgba(224,242,254,0.5)" : `rgba(103,232,249,${0.18 + charge * 0.28})`);
        aura.addColorStop(1, "rgba(34,211,238,0)");
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(0, 0, boom ? 150 : 40 + charge * 70, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = boom ? "#e0f2fe" : "#67e8f9";
        ctx.shadowColor = "#22d3ee";
        ctx.shadowBlur = boom ? 22 : 10 + charge * 10;
        ctx.lineWidth = boom ? 5 : 2 + charge * 2;
        ctx.globalAlpha = 0.35 + charge * 0.55;
        ctx.beginPath();
        ctx.arc(0, 0, 28 + charge * 36 + (boom ? (t - 40) * 10 : 0), 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      } else if (move === "bastion_s2") {
        ctx.save();
        ctx.strokeStyle = "#e0f2fe";
        ctx.shadowColor = "#22d3ee";
        ctx.shadowBlur = 16;
        ctx.lineWidth = 3;
        for (let i = 0; i < 5; i += 1) {
          ctx.globalAlpha = 0.75 - i * 0.12;
          ctx.beginPath();
          ctx.moveTo(f.x - facing * (12 + i * 14), f.y - 24 - i * 10);
          ctx.lineTo(f.x - facing * (46 + i * 20), f.y - 18 - i * 8);
          ctx.stroke();
        }
        ctx.restore();
      } else if (move === "bastion_ult") {
        ctx.save();
        const aura = ctx.createRadialGradient(f.x, f.y - 48, 8, f.x, f.y - 48, 120);
        aura.addColorStop(0, "rgba(224,242,254,0.35)");
        aura.addColorStop(1, "rgba(34,211,238,0)");
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(f.x, f.y - 48, 120, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  function skillReleaseEffect(fighter, slot) {
    if (headless) return;
    const isUlt = slot === "ult";
    const id = fighter.id;
    const color = isUlt
      ? (id === "gale" ? "#bbf7d0" : id === "iron" ? "#fb7185" : id === "bastion" ? "#7dd3fc" : "#fde047")
      : fighter.def.accent;
    const centerY = fighter.y - 52;
    burst(fighter.x, centerY, color, isUlt ? 80 : id === "iron" || id === "bastion" ? 56 : 48, isUlt ? 12 : 9);
    burst(fighter.x, centerY, "#ffffff", isUlt ? 32 : 22, isUlt ? 8 : 6);
    if (id === "iron") {
      burst(fighter.x, centerY - 18, "#fbcfe8", 20, 6);
      if (impactRings.length >= 10) impactRings.shift();
      impactRings.push({ x: fighter.x, y: centerY, life: 20, max: 20, radius: 18, speed: 11, color: "#f9a8d4" });
    }
    if (id === "bastion") {
      burst(fighter.x, GROUND - 6, "#bae6fd", 18, 5);
      if (impactRings.length >= 10) impactRings.shift();
      impactRings.push({ x: fighter.x, y: GROUND, life: 22, max: 22, radius: 16, speed: 9, color: "#7dd3fc" });
    }
    if (!isUlt) {
      shake = Math.max(shake, 10);
      return;
    }
    for (let i = 0; i < 4; i += 1) {
      if (impactRings.length >= 10) impactRings.shift();
      const life = 32 + i * 4;
      impactRings.push({
        x: fighter.x,
        y: centerY,
        life,
        max: life,
        radius: 38 + i * 24,
        speed: 14 + i * 1.8,
        color: i % 2 ? "#ffffff" : color,
      });
    }
    if (combatFeedback.length >= 12) combatFeedback.shift();
    combatFeedback.push({
      x: fighter.x,
      y: fighter.y - 138,
      vy: -0.2,
      life: 70,
      max: 70,
      size: 42,
      color,
      text: fighter.def[slot].name,
    });
    shake = Math.max(shake, 24);
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  class Fighter {
    constructor(def, x, facing, isCpu) {
      this.def = def;
      this.id = def.id;
      this.x = x;
      this.y = GROUND;
      this.vx = 0;
      this.vy = 0;
      this.facing = facing;
      this.hp = def.hp;
      this.maxHp = def.hp;
      this.mp = 35;
      this.maxMp = MAX_MP;
      this.state = "idle";
      this.stateT = 0;
      this.anim = Math.random() * 40;
      this.invuln = 0;
      this.armor = 0;
      this.cd0 = 0;
      this.cd1 = 0;
      this.cd2 = 0;
      this.walkPhase = 0;
      this.stepReady = false;
      this.blocking = false;
      this.shielding = 0;
      this.airJumps = def.airJumps;
      this.dead = false;
      this.hitFlash = 0;
      this.attackHit = false;
      this.hitOn = false;
      this.hitSpec = null;
      this.skillMove = null;
      this.isCpu = isCpu;
      this.dashT = 0;
      this.lockX = 0;
      this.barrier = 0;
      this.barrierT = 0;
      this.heavyT = 0;
      this.ai = {
        wait: 0,
        left: false,
        right: false,
        up: false,
        punch: false,
        special: false,
        skill1: false,
        skill2: false,
        ult: false,
      };
    }

    grounded() {
      return this.y >= GROUND - 0.01;
    }

    busy() {
      return ["punch", "skill", "stun", "dead"].includes(this.state);
    }

    gainMp(n) {
      this.mp = Math.min(this.maxMp, this.mp + n);
    }

    bodyBox() {
      return { x: this.x - 22 * SIZE, y: this.y - 92 * SIZE, w: 44 * SIZE, h: 92 * SIZE };
    }

    openHit(spec) {
      this.hitOn = true;
      this.hitSpec = spec;
    }

    closeHit() {
      this.hitOn = false;
    }

    attackBox() {
      if (this.state === "punch") {
        const spec = this.def.punch;
        const t = this.stateT;
        if (t < spec.startup || t >= spec.startup + spec.active || this.attackHit) return null;
        const reach = spec.reach * SIZE;
        const x = this.facing === 1 ? this.x + 10 * SIZE : this.x - 10 * SIZE - reach;
        return { x, y: this.y - 72 * SIZE, w: reach, h: 26 * SIZE, spec: { ...spec, sfx: `${this.id}_punch` }, kind: "punch" };
      }
      if (this.state === "skill" && this.hitOn && !this.attackHit && this.hitSpec) {
        const spec = this.hitSpec;
        const scale = String(this.skillMove || "").endsWith("_ult") ? ULT_DAMAGE_SCALE : SKILL_DAMAGE_SCALE;
        const ultimate = String(this.skillMove || "").endsWith("_ult");
        const scaledSpec = { ...spec, dmg: spec.dmg * scale * (this.def.skillDmg || 1), empowered: scale, ultimate };
        const w = spec.w * SIZE;
        const x = this.facing === 1 ? this.x + (spec.xOff || 0) * SIZE : this.x - w - (spec.xOff || 0) * SIZE;
        return {
          x,
          y: this.y + spec.yOff * SIZE,
          w,
          h: spec.h * SIZE,
          spec: scaledSpec,
          kind: spec.kind || "skill",
        };
      }
      return null;
    }

    startAttack(kind) {
      if (this.dead || this.busy()) return;
      this.state = kind;
      this.stateT = 0;
      this.attackHit = false;
      this.blocking = false;
      this.vx *= 0.45;
      playSfx(`${this.id}_punch`);
    }

    startSkill(slot, opponent) {
      if (this.dead || this.busy()) return;
      if (slot === "s0" && this.cd0 > 0) return;
      if (slot === "s1" && this.cd1 > 0) return;
      if (slot === "s2" && this.cd2 > 0) return;
      if (slot === "ult" && this.mp < this.def.ult.cost) return;

      this.state = "skill";
      this.stateT = 0;
      this.attackHit = false;
      this.hitOn = false;
      this.blocking = false;
      this.skillMove = `${this.id}_${slot}`;
      if (slot === "s0") this.cd0 = Math.round(this.def.s0.cd * (this.def.skillCd || 1));
      if (slot === "s1") this.cd1 = Math.round(this.def.s1.cd * (this.def.skillCd || 1));
      if (slot === "s2") this.cd2 = Math.round(this.def.s2.cd * (this.def.skillCd || 1));
      if (slot === "ult") {
        this.mp = 0;
        if (!headless) {
          freezeText = this.def.ult.name;
          setTimeout(() => {
            if (freezeText === this.def.ult.name) freezeText = "";
          }, 420);
        }
      }

      const move = this.skillMove;
      if (move === "gale_s0") {
        this.vx = this.facing * 5.4;
        this.vy = -18;
      } else if (move === "iron_s0") {
        this.vx = this.facing * 2;
      } else if (move === "gale_s1") {
        this.dashT = 16;
        this.invuln = 5;
        this.vx = this.facing * 14;
        this.vy = 0;
      } else if (move === "gale_s2") {
        this.vx = this.facing * 6;
      } else if (move === "gale_ult") {
        this.invuln = 18;
        this.vx = 0;
        burst(this.x, this.y - 50, "#bbf7d0", 22, 8);
        burst(this.x, this.y - 50, "#ffffff", 16, 7);
      } else if (move === "iron_s1") {
        this.armor = 120;
        this.vx = 0;
      } else if (move === "iron_s2") {
        this.armor = 30;
        this.vx = this.facing * 8.2;
      } else if (move === "iron_ult") {
        this.armor = 40;
        this.vx = 0;
        burst(this.x, this.y - 40, this.def.color, 24, 6);
      } else if (move === "shadow_s1") {
        burst(this.x, this.y - 50, this.def.color, 18, 6);
      } else if (move === "shadow_ult") {
        this.invuln = 36;
        burst(this.x, this.y - 50, this.def.color, 22, 7);
      } else if (move === "pyro_ult") {
        this.lockX = Math.max(LEFT_WALL, Math.min(RIGHT_WALL, opponent.x + opponent.vx * 18));
      } else if (move === "bastion_s0") {
        this.vx = this.facing * 2.4;
      } else if (move === "bastion_s1") {
        this.armor = 48;
        this.vx = 0;
        this.vy = 0;
      } else if (move === "bastion_s2") {
        this.vx = this.facing * 8;
      } else if (move === "bastion_ult") {
        this.invuln = 10;
        this.vx = 0;
        burst(this.x + this.facing * 40, this.y - 40, this.def.accent, 24, 7);
      }
      skillReleaseEffect(this, slot);
      playSfx(move);
    }

    takeHit(hit, from) {
      if (this.dead || this.invuln > 0) return false;
      if (this.shielding > 0) {
        if (hit.kind === "projectile" && !hit.pierce) {
          burst(this.x + this.facing * 18, this.y - 50, this.def.color, 10, 3);
          playSfx("bastion_guard");
          return false;
        }
        if (hit.kind !== "projectile") {
          const dive = String(from.skillMove || "") === "gale_s0" && !from.grounded();
          if (!dive) {
            this.shielding = 0;
            this.state = "idle";
            this.skillMove = null;
            this.closeHit();
            from.takeHit({ dmg: 13 * SKILL_DAMAGE_SCALE, kb: 8, stun: 15, kind: "counter", sfx: "none", empowered: SKILL_DAMAGE_SCALE }, this);
            burst(this.x + this.facing * 20, this.y - 50, this.def.color, 22, 7);
            playSfx("bastion_counter");
            this.gainMp(8);
            return false;
          }
        }
      }

      const blocked = this.blocking && this.grounded() && Math.sign(from.x - this.x) === this.facing;
      let dmg = hit.dmg;
      let kb = hit.kb;
      let stun = hit.stun;
      if (blocked) {
        dmg *= 0.28;
        kb *= 0.25;
        stun = Math.max(6, stun * 0.35);
        beep(160, 0.05, "triangle", 0.05);
        noiseBurst(0.05, 0.07, 700);
        from.gainMp(4);
      } else {
        impactSound(hit);
        const effectPower = hit.empowered || 1;
        burst(this.x, this.y - 50, hit.ultimate ? "#fde047" : "#fff7ed", 18 + Math.round(effectPower * 8), 6.5 + effectPower * 1.8);
        if (effectPower > 1) {
          if (hit.ultimate) {
          if (impactRings.length >= 10) impactRings.shift();
          impactRings.push({
            x: this.x,
            y: this.y - 50,
            life: 18,
            max: 18,
            radius: 22,
            speed: 7,
            color: "#fde047",
          });
          }
          if (combatFeedback.length >= 12) combatFeedback.shift();
          combatFeedback.push({
            x: this.x,
            y: this.y - 102,
            vy: -0.85,
            life: 38,
            max: 38,
            color: hit.ultimate ? "#fde047" : "#ffffff",
            text: `${Math.round(dmg)}!`,
          });
        }
        from.gainMp(12);
        this.gainMp(5);
      }

      if (!blocked && this.barrier > 0) {
        const absorbed = Math.min(this.barrier, dmg);
        this.barrier -= absorbed;
        dmg -= absorbed;
        burst(this.x - 30, this.y - 58, this.def.accent, 10, 4);
        burst(this.x + 30, this.y - 58, "#ffffff", 10, 4);
        if (this.barrier <= 0) this.barrierT = 0;
      }

      if (this.armor > 0 && !blocked && hit.kind !== "counter") {
        const resist = hit.kind === "projectile" ? 0.69 : 0.72;
        this.hp = Math.max(0, this.hp - dmg * resist);
        this.hitFlash = 6;
        const dir = Math.sign(this.x - from.x) || -from.facing;
        this.vx += dir * kb * 0.18;
        shake = Math.min(16, shake + 4);
        if (this.hp <= 0) this.ko(dir);
        return true;
      }

      this.hp = Math.max(0, this.hp - dmg);
      this.hitFlash = 8;
      const dir = Math.sign(this.x - from.x) || -from.facing;
      this.vx = dir * kb;
      this.vy = blocked ? -1.5 : -4.2 - kb * 0.12;
      this.y = Math.min(this.y, GROUND - 1);
      this.state = "stun";
      this.stateT = 0;
      this.stunMax = stun;
      this.blocking = false;
      this.shielding = 0;
      this.dashT = 0;
      this.skillMove = null;
      this.closeHit();
      shake = Math.min(24, shake + (blocked ? 4 : hit.dmg >= 45 ? 18 : hit.dmg >= 24 ? 13 : 8));
      hitstop = blocked ? 4 : hit.dmg >= 45 ? 16 : hit.dmg >= 24 ? 12 : 8;
      if (this.hp <= 0) this.ko(dir);
      return !blocked;
    }

    ko(dir) {
      this.dead = true;
      this.state = "dead";
      this.vx = dir * 10;
      this.vy = -8;
      burst(this.x, this.y - 40, this.def.color, 36, 8);
    }

    update(input, opponent) {
      this.anim += 1;
      if (this.cd0 > 0) this.cd0 -= 1;
      if (this.cd1 > 0) this.cd1 -= 1;
      if (this.cd2 > 0) this.cd2 -= 1;
      if (this.invuln > 0) this.invuln -= 1;
      if (this.armor > 0) this.armor -= 1;
      if (this.hitFlash > 0) this.hitFlash -= 1;
      if (this.shielding > 0) this.shielding -= 1;
      if (this.barrierT > 0) this.barrierT -= 1;
      else this.barrier = 0;
      if (this.heavyT > 0) this.heavyT -= 1;
      if (!this.dead && this.state !== "skill") this.gainMp(0.1);

      if (this.dead) {
        this.stateT += 1;
        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.96;
        if (this.y > GROUND) {
          this.y = GROUND;
          this.vy = 0;
          this.vx *= 0.8;
        }
        return;
      }

      if (this.state === "stun") {
        this.stateT += 1;
        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.86;
        if (this.y >= GROUND) {
          this.y = GROUND;
          this.vy = 0;
        }
        if (this.stateT >= this.stunMax) this.state = "idle";
        this.clamp();
        return;
      }

      if (this.state === "skill") this.updateSkill(opponent);

      if (this.state === "punch") {
        this.stateT += 1;
        const spec = this.def.punch;
        const total = spec.startup + spec.active + spec.recover;
        this.vy += GRAVITY;
        this.x += this.vx * 0.4;
        this.y += this.vy;
        this.vx *= 0.86;
        if (this.y >= GROUND) {
          this.y = GROUND;
          this.vy = 0;
        }
        if (this.stateT >= total) this.state = "idle";
        this.clamp();
        return;
      }

      this.blocking = !!(input.down && this.grounded() && !this.busy());
      if (!this.busy() && this.shielding <= 0) {
        if (input.punch || input.special || input.skill1 || input.skill2 || input.ult) {
          this.facing = Math.sign(opponent.x - this.x) || this.facing;
        }
        if (input.ult) this.startSkill("ult", opponent);
        else if (input.skill1) this.startSkill("s1", opponent);
        else if (input.skill2) this.startSkill("s2", opponent);
        else if (input.special) this.startSkill("s0", opponent);
        else if (input.punch) this.startAttack("punch");
      }
      if (this.busy() && this.state !== "skill") {
        this.clamp();
        return;
      }
      if (this.state === "skill") {
        this.clamp();
        return;
      }

      const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
      if (this.blocking) {
        this.vx *= 0.7;
      } else if (dir) {
        this.facing = dir;
        const heavyScale = this.heavyT > 0 ? 0.7 : 1;
        this.vx += dir * (this.grounded() ? 0.9 : 0.42) * heavyScale;
        const cap = this.def.speed * (this.grounded() ? 1 : 0.85) * heavyScale;
        this.vx = Math.max(-cap, Math.min(cap, this.vx));
        this.state = this.grounded() ? "walk" : "jump";
        if (this.grounded()) {
          this.walkPhase = (this.walkPhase + 0.014 + Math.abs(this.vx) * 0.003) % 1;
          const plant = this.walkPhase < 0.04 || (this.walkPhase > 0.5 && this.walkPhase < 0.54);
          if (plant && this.stepReady) {
            this.stepReady = false;
            burst(this.x - this.facing * 6, GROUND - 1, "rgba(255,230,180,0.75)", 3, 1.2);
            noiseBurst(0.035, 0.05, 280);
          }
          if (!plant) this.stepReady = true;
        }
      } else {
        this.vx *= this.grounded() ? 0.72 : 0.94;
        this.state = this.grounded() ? "idle" : "jump";
      }

      if (input.up && this.heavyT <= 0) {
        if (this.grounded()) {
          this.vy = -this.def.jump;
          this.airJumps = this.def.airJumps;
          this.state = "jump";
          beep(300, 0.05, "sine", 0.03);
        } else if (this.airJumps > 0) {
          this.airJumps -= 1;
          this.vy = -this.def.jump * 0.92;
          burst(this.x, this.y, this.def.color, 8, 3);
        }
      }

      this.vy += GRAVITY;
      this.x += this.vx;
      this.y += this.vy;
      if (this.y >= GROUND) {
        if (this.vy > 8) burst(this.x, GROUND, "rgba(255,255,255,0.5)", 6, 2.2);
        this.y = GROUND;
        this.vy = 0;
        this.airJumps = this.def.airJumps;
      }
      this.clamp();
    }

    updateSkill(opponent) {
      this.stateT += 1;
      const t = this.stateT;
      const move = this.skillMove;
      this.closeHit();

      if (move === "gale_s0") {

          this.x += this.vx;

            this.facing = Math.sign(opponent.x - this.x) || this.facing;

          this.y += this.vy;
          this.vy += GRAVITY * 0.85;

        if (t === 13) {
          this.attackHit = false;

        if (t >= 13 && t <= 23) this.openHit({ dmg: 16.8, kb: 13, stun: 20, w: 78, h: 92, yOff: -100, sfx: "gale_s0" });

      } else if (move === "iron_s0") {
        this.vx *= 0.55;
        if (t <= 9) this.x += this.facing * 3.5;
        if (t === 10 && Math.abs(opponent.x - this.x) < 104 && Math.abs(opponent.y - this.y) < 90) {
          const clean = opponent.takeHit({ dmg: 17.2 * SKILL_DAMAGE_SCALE * (this.def.skillDmg || 1), kb: 13, stun: 20, kind: "skill", sfx: "iron_s0", empowered: SKILL_DAMAGE_SCALE }, this);
          if (!clean) {
            this.attackHit = true;
          } else {
            this.attackHit = true;
            opponent.x = this.x - this.facing * 54;
            opponent.y = Math.min(opponent.y, this.y);
            if (this === player) {

            burst(opponent.x, opponent.y - 54, this.def.accent, 36, 9);

            this.mp = Math.min(this.maxMp, this.mp + 55);

      } else if (move === "shadow_s0") {

      } else if (move === "pyro_s0") {

          projectiles.push({
            type: "curtain",

          projectiles.push({

          });
          burst(this.x - 34, this.y - 58, "#60a5fa", 18, 5);
          burst(this.x + 34, this.y - 58, "#f9a8d4", 18, 5);
        }
        this.vx *= 0.55;
        if (t >= 26) this.endSkill();
      } else if (move === "bastion_s0") {
        this.vx *= 0.55;
        if (t === 10) {
          playSfx("bastion_s0_stomp");
          burst(this.x + this.facing * 40, GROUND, "#67e8f9", 22, 7);
          burst(this.x + this.facing * 40, GROUND, "#ffffff", 12, 5);
          if (impactRings.length >= 10) impactRings.shift();
          impactRings.push({ x: this.x + this.facing * 48, y: GROUND, life: 18, max: 18, radius: 20, speed: 12, color: "#22d3ee" });
          shake = Math.max(shake, 10);
        }
        if (t >= 10 && t <= 16) this.openHit({ dmg: 16.4, kb: 12, stun: 18, w: 110, h: 72, yOff: -70, xOff: 8, sfx: "bastion_s0" });
        if (t >= 28) this.endSkill();
      } else if (move === "gale_s1") {
        this.dashT -= 1;
        this.x += this.facing * 13;
        this.vy = 0;
        this.openHit({ dmg: 11.5, kb: 8, stun: 13, w: 70, h: 70, yOff: -80, sfx: "gale_s1" });
        if (t % 2 === 0) leaveAfterimage(this, 8, 0.22);
        if (t >= 16) this.endSkill();
      } else if (move === "gale_s2") {
        this.x += this.facing * 5.5;
        this.vy *= 0.4;
        if (t === 6 || t === 14 || t === 22) {

        if ((t >= 6 && t <= 9) || (t >= 14 && t <= 17) || (t >= 22 && t <= 26)) {
          this.openHit({ dmg: t >= 22 ? 12.8 : 8.4, kb: t >= 22 ? 9 : 5, stun: 12, w: 64, h: 50, yOff: -70, sfx: "gale_s2" });
        }
        if (t >= 34) this.endSkill();
      } else if (move === "gale_ult") {
        this.vx *= 0.6;
        if (t === 8 || t === 18 || t === 28) {
          this.facing = Math.sign(opponent.x - this.x) || this.facing;

          this.attackHit = false;
          burst(opponent.x, opponent.y - 40, "#ffffff", 28, 10);

        if ((t >= 8 && t <= 12) || (t >= 18 && t <= 22) || (t >= 28 && t <= 34)) {
          this.openHit({ dmg: t >= 28 ? 20 : 13, kb: t >= 28 ? 14 : 8, stun: 17, w: 112, h: 100, yOff: -106, sfx: "gale_ult" });
        }
        if (t >= 42) this.endSkill();
      } else if (move === "iron_s1") {

          if (impactRings.length >= 10) impactRings.shift();
          impactRings.push({ x: this.x, y: this.y - 58, life: 24, max: 24, radius: 16, speed: 8, color: "#f9a8d4" });

      } else if (move === "iron_s2") {
        this.x += this.facing * 7.2;

        if (t % 2 === 0) leaveAfterimage(this, 10, 0.28);

        if (t >= 23) this.endSkill();
      } else if (move === "iron_ult") {
        this.vx *= 0.5;
        if (t === 12 || t === 24 || t === 38) {

          burst(this.x + this.facing * 36, GROUND, this.def.color, 28, 8);
          burst(this.x + this.facing * 36, GROUND, "#fbcfe8", 16, 6);
          if (impactRings.length >= 10) impactRings.shift();
          impactRings.push({ x: this.x + this.facing * 36, y: GROUND, life: 18, max: 18, radius: 24, speed: 14, color: "#fb7185" });

        if ((t >= 12 && t <= 16) || (t >= 24 && t <= 28) || (t >= 38 && t <= 44)) {
          this.openHit({ dmg: t >= 38 ? 23.5 : 16.5, kb: t >= 38 ? 15 : 9, stun: 18, w: 112, h: 76, yOff: -78, xOff: -8, sfx: "iron_ult" });
        }
        if (t >= 56) this.endSkill();
      } else if (move === "shadow_s1") {
        if (t === 8) {
          leaveAfterimage(this, 16, 0.42);
          leaveAfterimage(this, 12, 0.28);
          burst(this.x, this.y - 50, this.def.color, 16, 5);
          this.x = opponent.x - opponent.facing * 58;

          this.facing = Math.sign(opponent.x - this.x) || this.facing;
          this.invuln = 14;
          burst(this.x, this.y - 50, this.def.accent, 16, 5);
          playSfx("shadow_s1_slash");
        }
        if (t >= 10 && t <= 14) this.openHit({ dmg: 17.5, kb: 9, stun: 16, w: 86, h: 80, yOff: -88, sfx: "shadow_s1" });
        if (t >= 9) leaveAfterimage(this, 10, 0.32);
        if (t >= 22) this.endSkill();
      } else if (move === "shadow_s2") {
        this.vx *= 0.65;
        if (t === 10 && !opponent.dead && opponent.invuln <= 0 && Math.abs(opponent.x - this.x) < 145 && Math.abs(opponent.y - this.y) < 105) {
          const stolen = Math.min(40, opponent.mp);
          opponent.mp -= stolen;
          this.gainMp(stolen * 0.6);
          opponent.state = "stun";
          opponent.stateT = 0;
          opponent.stunMax = 24;
          opponent.vx = 0;
          opponent.vy = 0;
          opponent.blocking = false;
          opponent.shielding = 0;
          opponent.skillMove = null;
          opponent.closeHit();
          burst(opponent.x - 32, opponent.y - 58, this.def.color, 20, 5);
          burst(opponent.x + 32, opponent.y - 58, "#ffffff", 20, 5);
          shake = Math.max(shake, 10);
        }
        if (t >= 24) this.endSkill();
      } else if (move === "shadow_ult") {
        if (t === 6 || t === 14 || t === 22 || t === 30 || t === 38) {
          leaveAfterimage(this, 16, 0.45);
          leaveAfterimage(this, 11, 0.28);
          burst(this.x, this.y - 50, this.def.color, 12, 5);
          const side = (t / 8) % 2 === 0 ? -1 : 1;
          this.x = opponent.x + side * 52;
          this.y = opponent.y;
          this.facing = Math.sign(opponent.x - this.x) || this.facing;
          this.attackHit = false;
          playSfx("shadow_ult_cut");
        }
        if ([7, 8, 9, 15, 16, 23, 24, 31, 32, 39, 40, 41].includes(t)) {
          this.openHit({ dmg: 9.85, kb: 6, stun: 9, w: 80, h: 78, yOff: -86, sfx: "shadow_ult" });
          leaveAfterimage(this, 9, 0.34);

        if (t >= 50) this.endSkill();
      } else if (move === "pyro_s1") {
        if (t === 11) {
          projectiles.push({
            type: "note",
            x: this.x + this.facing * 36,
            y: this.y - 58,

            color: "#fb923c",
            dmg: 21.2,
            kb: 8,
            stun: 15,
            r: 16,
            sfx: "pyro_s1",
          });
          burst(this.x + this.facing * 30, this.y - 58, "#f59e0b", 10, 3);
          playSfx("pyro_s1_shot");
        }
        this.vx *= 0.8;
        if (t >= 24) this.endSkill();
      } else if (move === "pyro_s2") {
        if (t === 10) {
          projectiles.push({
            type: "wave",

          });
          burst(this.x + this.facing * 28, GROUND - 8, "#fb923c", 16, 4);
          playSfx("pyro_s2_wave");
          shake = Math.max(shake, 6);
