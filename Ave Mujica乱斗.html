        this.vx *= 0.7;
        if (t >= 24) this.endSkill();
      } else if (move === "pyro_ult") {
        if (t === 6) {
          hazards.push({
            type: "meteor",
            x: this.lockX,
            y: 80,
            delay: 0,
            life: 28,
            owner: this,
            dmg: 32,
            kb: 20,
            stun: 26,
            hit: false,
            color: "#fb923c",
            vy: 15.5,
            sfx: "pyro_ult",
          });
          playSfx("pyro_ult_fall");
        }
        this.vx *= 0.7;
        if (t >= 38) this.endSkill();
      } else if (move === "bastion_s1") {
        this.vx = 0;
        this.vy = 0;
        if (t === 40) {
          playSfx("bastion_s1_shot");
          burst(this.x, this.y - 52, "#67e8f9", 28, 8);
          burst(this.x, this.y - 52, "#ffffff", 16, 6);
          if (impactRings.length >= 10) impactRings.shift();
          impactRings.push({ x: this.x, y: this.y - 48, life: 22, max: 22, radius: 24, speed: 14, color: "#22d3ee" });
          shake = Math.max(shake, 12);
        }
        if (t >= 40 && t <= 44) this.openHit({ dmg: 22.4, kb: 6, stun: 36, w: 220, h: 90, yOff: -92, xOff: -40, sfx: "bastion_s1" });
        if (t >= 48) this.endSkill();
      } else if (move === "bastion_s2") {
        this.x += this.facing * 8;
        this.vy = 0;
        if (t === 5 || t === 12) {
          this.attackHit = false;
          playSfx("bastion_s2_bash");
        }
        if (t >= 5 && t <= 9) this.openHit({ dmg: 8.4, kb: 6, stun: 13, w: 72, h: 64, yOff: -72, sfx: "bastion_s2" });
        if (t >= 12 && t <= 17) this.openHit({ dmg: 12.6, kb: 10, stun: 13, w: 80, h: 70, yOff: -76, sfx: "bastion_s2" });
        if (t >= 26) this.endSkill();
      } else if (move === "bastion_ult") {
        this.vx *= 0.5;
        if (t === 8 || t === 16 || t === 24 || t === 34) {
          const wave = t === 8 ? 0 : t === 16 ? 1 : t === 24 ? 2 : 3;
          hazards.push({
            type: "pillar",
            x: this.x + this.facing * (56 + wave * 48),
            y: GROUND,
            delay: 0,
            life: 16,
            owner: this,
            dmg: wave >= 3 ? 15 : wave >= 2 ? 11 : 9,
            kb: wave >= 3 ? 14 : wave >= 2 ? 10 : 8,
            stun: 15,
            hit: false,
            color: "#67e8f9",
            sfx: "bastion_ult",
          });
          burst(this.x + this.facing * (56 + wave * 48), GROUND, "#e0f2fe", 20, 7);
          shake = 12;
          playSfx("bastion_ult_quake");
        }
        if (t >= 52) this.endSkill();
      } else {
        this.endSkill();
      }
    }

    endSkill() {
      this.state = "idle";
      this.skillMove = null;
      this.closeHit();
      this.dashT = 0;
    }

    clamp() {
      this.x = Math.max(LEFT_WALL, Math.min(RIGHT_WALL, this.x));
      if (this.y > GROUND) this.y = GROUND;
    }
  }

  function resolveHits() {
    const pair = [[player, cpu], [cpu, player]];
    for (const [atk, def] of pair) {
      const box = atk.attackBox();
      if (!box) continue;
      if (rectsOverlap(box, def.bodyBox())) {
        atk.attackHit = true;
        const clean = def.takeHit({ ...box.spec, kind: box.kind || box.spec.kind || "skill" }, atk);
        if (clean && atk === player) {
          comboCount += 1;
          comboTimer = 70;
        }
      }
    }

    for (let i = projectiles.length - 1; i >= 0; i -= 1) {
      const p = projectiles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 1;
      if (p.type === "wave") {
        p.y = GROUND - 24;
        if (!headless) {
          addParticle({
            x: p.x + (Math.random() * 28 - 14),
            y: GROUND - Math.random() * 22,
            vx: -p.vx * 0.08,
            vy: -1.6 - Math.random() * 1.4,
            life: 12,
            max: 12,
            size: 3 + Math.random() * 3,
            color: Math.random() < 0.5 ? "#fb923c" : "#fff7ed",
          });
        }
      } else if (!headless) {
        addParticle({
          x: p.x, y: p.y, vx: 0, vy: -0.4, life: 10, max: 10, size: Math.max(2, p.r / 3), color: p.color,
        });
      }
      const target = p.owner === player ? cpu : player;
      const pb = p.type === "wave"
        ? { x: p.x - 48, y: GROUND - 92, w: 96, h: 92 }
        : { x: p.x - p.r, y: p.y - p.r, w: p.r * 2, h: p.r * 2 };
      if (rectsOverlap(pb, target.bodyBox())) {
        const clean = target.takeHit({ dmg: p.dmg * SKILL_DAMAGE_SCALE * (p.owner.def.skillDmg || 1), kb: p.kb, stun: p.stun, kind: "projectile", pierce: !!p.pierce, sfx: p.sfx, empowered: SKILL_DAMAGE_SCALE }, p.owner);
        burst(p.x, p.y, p.color, 16, 5);
        if (clean && p.owner === player) {
          comboCount += 1;
          comboTimer = 70;
        }
        removeAtSwap(projectiles, i);
        continue;
      }
      if (p.life <= 0 || p.x < 0 || p.x > CANVAS_W) removeAtSwap(projectiles, i);
    }

    for (let i = hazards.length - 1; i >= 0; i -= 1) {
      const h = hazards[i];
      if (h.delay > 0) {
        h.delay -= 1;
        if (h.delay > 0) continue;
      }
      if (h.type === "meteor") {
        h.y += h.vy || 14;
        if (h.y >= GROUND - 20) {
          h.y = GROUND;
          h.type = "boom";
          h.life = 14;
          shake = 18;
          burst(h.x, GROUND, h.color, 36, 8);
          playSfx("pyro_ult_boom");
        }
      }
      h.life -= 1;
      const box = hazardBox(h);
      const target = h.owner === player ? cpu : player;
      if (!h.hit && box && rectsOverlap(box, target.bodyBox())) {
        h.hit = true;
        const scale = h.scale || ULT_DAMAGE_SCALE;
        const clean = target.takeHit({ dmg: h.dmg * scale * (h.owner.def.skillDmg || 1), kb: h.kb, stun: h.stun, kind: "skill", sfx: "none", empowered: scale, ultimate: !h.scale }, h.owner);
        if (clean && h.owner === player) {
          comboCount += 1;
          comboTimer = 70;
        }
      }
      if (h.life <= 0) removeAtSwap(hazards, i);
    }
  }

  function hazardBox(h) {
    if (h.type === "shock" || h.type === "boom") return { x: h.x - 90, y: GROUND - 80, w: 180, h: 80 };
    if (h.type === "meteor") return { x: h.x - 18, y: h.y - 18, w: 36, h: 36 };
    if (h.type === "skillShock") return { x: h.x - h.radius, y: GROUND - h.radius * 1.45, w: h.radius * 2, h: h.radius * 1.45 };
    if (h.type === "pillar") return { x: h.x - 32, y: GROUND - 150, w: 64, h: 150 };
    return null;
  }

  function pushApart() {
    if (Math.abs(player.x - cpu.x) < 52 * SIZE && Math.abs(player.y - cpu.y) < 80 * SIZE) {
      const mid = (player.x + cpu.x) / 2;
      const gap = 26 * SIZE;
      if (player.x <= cpu.x) {
        player.x = mid - gap;
        cpu.x = mid + gap;
      } else {
        player.x = mid + gap;
        cpu.x = mid - gap;
      }
    }
  }

  function playerInput() {
    return {
      left: !!(keys.KeyA || keys.ArrowLeft),
      right: !!(keys.KeyD || keys.ArrowRight),
      up: consumePress("KeyW") || consumePress("ArrowUp") || consumePress("Space"),
      down: false,
      punch: consumePress("KeyJ"),
      special: consumePress("KeyK"),
      skill1: consumePress("KeyU"),
      skill2: consumePress("KeyI"),
      ult: consumePress("KeyL") || consumePress("KeyO"),
    };
  }

  function consumePress(code) {
    if (!justPressed[code]) return false;
    justPressed[code] = false;
    return true;
  }

  function cpuThink() {
    const cfg = DIFFICULTIES[selection.difficulty];
    const me = cpu;
    const opp = player;
    const dist = opp.x - me.x;
    const abs = Math.abs(dist);
    const faceOpp = dist > 0;
    const oppMove = String(opp.skillMove || "");
    const oppAttacking = opp.state === "punch" || (opp.state === "skill" && !oppMove.includes("iron_s1") && !oppMove.includes("shadow_s0"));
    const oppStun = opp.state === "stun";
    const preferred = me.id === "pyro" ? 240 : me.id === "gale" ? 88 : me.id === "shadow" ? 90 : me.id === "iron" ? 86 : 155;
    const roll = (p) => Math.random() < p;
    const toward = () => { me.ai.left = !faceOpp; me.ai.right = faceOpp; };
    const away = () => { me.ai.left = faceOpp; me.ai.right = !faceOpp; };
    const stay = () => { me.ai.left = false; me.ai.right = false; };

    me.ai.punch = false;
    me.ai.special = false;
    me.ai.skill1 = false;
    me.ai.skill2 = false;
    me.ai.ult = false;
    me.ai.up = false;
    me.facing = faceOpp ? 1 : -1;

    const incoming = projectiles.find((p) => {
      if (p.owner === me) return false;
      const closing = (p.vx > 0 && p.x < me.x + 20) || (p.vx < 0 && p.x > me.x - 20);
      return closing && Math.abs(p.x - me.x) < 230;
    });
    const meteor = hazards.find((h) => h.owner !== me && (h.type === "meteor" || h.type === "boom") && Math.abs(h.x - me.x) < 110);
    const threatened = !!(incoming || meteor || (oppAttacking && abs < 130));

    if (threatened && roll(cfg.precision)) {
      if (incoming) {
        if (me.id === "iron" && me.cd2 <= 0 && abs < 240) { toward(); me.ai.skill2 = true; return me.ai; }
        if (me.id === "iron" && me.cd1 <= 0) { toward(); me.ai.skill1 = true; return me.ai; }
        if (me.id === "gale" && me.cd1 <= 0) { me.ai.skill1 = true; return me.ai; }
        if (me.id === "shadow" && me.cd1 <= 0 && abs < 360) { me.ai.skill1 = true; return me.ai; }
        if (me.id === "bastion" && me.cd2 <= 0 && abs < 200) { toward(); me.ai.skill2 = true; return me.ai; }
        me.ai.up = true;
        away();
        return me.ai;
      }
      if (meteor) {
        away();
        if (me.id === "gale" && me.cd1 <= 0) me.ai.skill1 = true;
        else if (me.id === "shadow" && me.cd1 <= 0) me.ai.skill1 = true;
        return me.ai;
      }
      if (oppAttacking) {
        if (oppMove.includes("iron_s0")) {
          away();
          me.ai.up = true;
          return me.ai;
        }
        if (me.id === "shadow" && me.cd2 <= 0 && abs < 145) { me.ai.skill2 = true; return me.ai; }
        if (me.id === "gale" && me.cd1 <= 0 && abs < 240) { me.ai.skill1 = true; return me.ai; }
        if (me.id === "bastion" && me.cd2 <= 0 && abs < 170) { toward(); me.ai.skill2 = true; return me.ai; }
        if (me.id === "iron" && me.cd1 <= 0) { me.ai.skill1 = true; return me.ai; }
        if (abs < 80) away();
        else stay();
        return me.ai;
      }
    }

    const oppGuarding = opp.shielding > 0;

    if (oppGuarding) {
      away();
      if (me.id === "gale" && me.cd0 <= 0 && abs < 200 && roll(cfg.skill)) me.ai.special = true;
      else if (me.id === "shadow" && me.cd2 <= 0 && abs < 150 && roll(0.42)) me.ai.skill2 = true;
      return me.ai;
    }

    me.ai.wait -= 1;
    if (me.ai.wait > 0 && !oppStun) {
      if (abs > preferred + 28) toward();
      else if (abs < preferred - 40) away();
      else stay();
      return me.ai;
    }
    me.ai.wait = cfg.think + Math.floor(Math.random() * 3);

    if (roll(cfg.miss) && !oppStun && !threatened) {
      if (abs > 60) toward();
      return me.ai;
    }

    if (me.mp >= me.def.ult.cost && roll(cfg.ult)) {
      const ultOk =
        (me.id === "pyro" && abs < 390) ||
        (me.id === "shadow" && abs < 250) ||
        (me.id === "gale" && abs < 165) ||
        (me.id === "iron" && abs < 145) ||
        (me.id === "bastion" && abs < 230);
      if (ultOk) {
        me.ai.ult = true;
        return me.ai;
      }
    }

    if (roll(cfg.skill)) {
      if (me.id === "pyro") {
        if (me.cd2 <= 0 && abs < 290 && abs > 36) { me.ai.skill2 = true; return me.ai; }
        if (me.cd1 <= 0 && abs > 64 && abs < 460) { me.ai.skill1 = true; return me.ai; }
        if (me.cd0 <= 0 && abs > 70) { me.ai.special = true; return me.ai; }
      } else if (me.id === "gale") {
        if (me.cd1 <= 0 && (abs > 110 || oppAttacking) && abs < 250) { me.ai.skill1 = true; return me.ai; }
        if (me.cd2 <= 0 && abs < 155) { me.ai.skill2 = true; return me.ai; }
        if (me.cd0 <= 0 && abs < 190 && abs > 46) { me.ai.special = true; return me.ai; }
      } else if (me.id === "iron") {
        if (me.cd0 <= 0 && abs < 112) { me.ai.special = true; return me.ai; }
        if (me.cd1 <= 0 && me.hp < me.maxHp * 0.7) { me.ai.skill1 = true; return me.ai; }
        if (me.cd2 <= 0 && abs < 175) { me.ai.skill2 = true; return me.ai; }
      } else if (me.id === "shadow") {
        if (me.cd0 <= 0 && me.hp > me.maxHp * 0.52 && (me.cd1 > 24 || me.cd2 > 24 || me.mp < 90)) { me.ai.special = true; return me.ai; }
        if (me.cd2 <= 0 && abs < 145 && (oppAttacking || opp.busy() || me.mp < 130)) { me.ai.skill2 = true; return me.ai; }
        if (me.cd1 <= 0 && abs < 340) { me.ai.skill1 = true; return me.ai; }
      } else if (me.id === "bastion") {
        if (me.cd1 <= 0 && abs < 280) { me.ai.skill1 = true; return me.ai; }
        if (me.cd2 <= 0 && abs < 190) { me.ai.skill2 = true; return me.ai; }
        if (me.cd0 <= 0 && abs < 150) { me.ai.special = true; return me.ai; }
      }
    }

    if (oppStun && cfg.aggro > 0.5) {
      toward();
      if (abs < 100 && roll(cfg.aggro)) {
        if (me.cd0 <= 0 && abs < 110 && me.id !== "pyro") me.ai.special = true;
        else me.ai.punch = true;
      }
      return me.ai;
    }

    if (abs > preferred + 32) {
      toward();
      if (roll(cfg.jump) && abs > 150) me.ai.up = true;
    } else if (abs < preferred - 42) {
      away();
    } else if (abs < 95 && roll(cfg.aggro)) {
      me.ai.punch = true;
    } else {
      stay();
    }
    return me.ai;
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = "rgba(255,248,235,0.55)";
    ctx.beginPath();
    ctx.ellipse(x, y, 48 * s, 18 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 28 * s, y + 4 * s, 36 * s, 16 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x - 26 * s, y + 6 * s, 30 * s, 14 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, "#7eb6e8");
    sky.addColorStop(0.38, "#f0a878");
    sky.addColorStop(0.72, "#f6c57a");
    sky.addColorStop(1, "#f8d9a0");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    const sunX = 1000;
    const sunY = 188;
    const sun = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 110);
    sun.addColorStop(0, "#fff6c8");
    sun.addColorStop(0.35, "#ffb24a");
    sun.addColorStop(1, "rgba(255,160,70,0)");
    ctx.fillStyle = sun;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 110, 0, Math.PI * 2);
    ctx.fill();

    drawCloud(160 + Math.sin(bgPulse * 0.01) * 12, 108, 1);
    drawCloud(470, 86, 0.85);
    drawCloud(1080 + Math.cos(bgPulse * 0.008) * 10, 128, 1.15);

    ctx.fillStyle = "#8ea3c8";
    ctx.beginPath();
    ctx.moveTo(0, 430);
    ctx.lineTo(180, 300);
    ctx.lineTo(340, 390);
    ctx.lineTo(520, 270);
    ctx.lineTo(740, 410);
    ctx.lineTo(960, 250);
    ctx.lineTo(1180, 360);
    ctx.lineTo(1280, 320);
    ctx.lineTo(1280, GROUND);
    ctx.lineTo(0, GROUND);
    ctx.fill();

    ctx.fillStyle = "#6f86b0";
    ctx.beginPath();
    ctx.moveTo(0, 480);
    ctx.lineTo(220, 360);
    ctx.lineTo(420, 470);
    ctx.lineTo(680, 340);
    ctx.lineTo(900, 455);
    ctx.lineTo(1280, 370);
    ctx.lineTo(1280, GROUND);
    ctx.lineTo(0, GROUND);
    ctx.fill();

    ctx.fillStyle = "#4d5f86";
    [[90, 70], [230, 110], [1080, 90], [1200, 130]].forEach(([x, w]) => {
      ctx.fillRect(x, GROUND - 160, w * 0.45, 160);
      ctx.fillRect(x + 8, GROUND - 188, w * 0.28, 28);
    });

    for (let i = 0; i < 5; i += 1) {
      const lx = 140 + i * 250;
      const glow = 0.55 + Math.sin(bgPulse * 0.08 + i) * 0.15;
      ctx.fillStyle = `rgba(255, 196, 90, ${glow})`;
      ctx.beginPath();
      ctx.ellipse(lx, 248, 10, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(90, 50, 20, 0.45)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(lx, 262);
      ctx.lineTo(lx, 292);
      ctx.stroke();
    }

    ctx.fillStyle = "#d7a05e";
    ctx.fillRect(0, GROUND, CANVAS_W, CANVAS_H - GROUND);
    for (let i = 0; i < 16; i += 1) {
      ctx.fillStyle = i % 2 === 0 ? "#e0ad6c" : "#c99252";
      ctx.fillRect(0, GROUND + 6 + i * 7, CANVAS_W, 7);
    }
    ctx.fillStyle = "#b67b3e";
    ctx.fillRect(0, GROUND - 8, CANVAS_W, 10);
    ctx.strokeStyle = "rgba(255,255,255,0.28)";
    ctx.lineWidth = 3;
    ctx.strokeRect(70, GROUND - 8, 1140, 8);
    ctx.strokeStyle = "rgba(255, 236, 200, 0.2)";
    ctx.beginPath();
    ctx.ellipse(640, GROUND + 18, 280, 22, 0, 0, Math.PI * 2);
    ctx.stroke();

    [[180, "#ffb14a"], [1100, "#ffb14a"]].forEach(([x, color]) => {
      const g = ctx.createRadialGradient(x, GROUND - 70, 4, x, GROUND - 70, 70);
      g.addColorStop(0, color);
      g.addColorStop(1, "rgba(255,160,60,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, GROUND - 70, 70, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#6b4424";
      ctx.fillRect(x - 5, GROUND - 78, 10, 78);
    });
  }

  let cachedBackgroundPulse = -Infinity;
  function drawCachedBackground() {
    if (bgPulse - cachedBackgroundPulse >= 4) {
      drawBackground();
      backgroundCacheCtx.setTransform(1, 0, 0, 1, 0, 0);
      backgroundCacheCtx.globalAlpha = 1;
      backgroundCacheCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      backgroundCacheCtx.drawImage(canvas, 0, 0);
      cachedBackgroundPulse = bgPulse;
    } else {
      ctx.drawImage(backgroundCache, 0, 0);
    }
  }

  function walkLeg(cycle, offset) {
    let p = cycle + offset;
    p -= Math.floor(p);
    const stride = 17;
    let x;
    let y;
    let bend;
    if (p < 0.5) {
      const u = p / 0.5;
      x = stride * (1 - 2 * u);
      y = 0;
      bend = 4 + u * 3;
    } else {
      const u = (p - 0.5) / 0.5;
      x = stride * (-1 + 2 * u);
      y = -Math.sin(u * Math.PI) * 13;
      bend = 10 + Math.sin(u * Math.PI) * 6;
    }
    const hipY = -36;
    return {
      x,
      y,
      kneeX: x * 0.45 + 6,
      kneeY: (hipY + y) * 0.5 + bend,
    };
  }

  function drawFighter(f, ghost) {
    const d = f.def || f;
    const grounded = f.y >= GROUND - 0.5;
    const anim = f.anim || 0;
    const walk = f.state === "walk" && grounded;
    const cycle = walk ? (f.walkPhase || 0) : 0;
    const punchT = f.state === "punch" ? Math.min(1, (f.stateT || 0) / 6) : 0;
    const move = f.skillMove || "";
    const spin = move === "gale_s0" ? Math.min(1, (f.stateT || 0) / 8) : 0;
    const upper = move === "iron_s0" ? Math.min(1, (f.stateT || 0) / 10) : 0;
    const seal = move === "shadow_s2";
    const scriptCast = move === "pyro_s0";
    const ironShow = move === "iron_s1";
    const ironRam = move === "iron_s2";
    const ironSlam = move === "iron_ult";
    const shadowDraw = move === "shadow_s0";
    const shadowSlash = move === "shadow_s1" || move === "shadow_ult";
    const bastionWind = move === "bastion_s0" && (f.stateT || 0) < 10;
    const bastionSlam = (move === "bastion_s0" && (f.stateT || 0) >= 10) || move === "bastion_ult";
    const bastionAim = move === "bastion_s1";
    const bastionDash = move === "bastion_s2";
    const skillPunch = f.state === "skill" && !spin && !seal && !scriptCast
      && !ironShow && !ironRam && !ironSlam && !shadowDraw && !shadowSlash
      && !bastionWind && !bastionSlam && !bastionAim && !bastionDash
      ? Math.min(1, (f.stateT || 0) / 8) : 0;
    const stunTilt = f.state === "stun" ? -0.18 * f.facing : 0;
    const deadTilt = f.dead ? 1.2 : 0;
    const isBusy = typeof f.busy === "function" ? f.busy() : false;
    const bob = walk ? Math.pow(Math.sin(cycle * Math.PI * 2), 2) * 2.2 : grounded && !isBusy ? Math.sin(anim * 0.1) * 1.2 : 0;

    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(stunTilt + deadTilt * (f.facing === 1 ? 0.5 : -0.5) + (walk ? 0.035 : 0)
      + (shadowSlash ? 0.22 : 0) + (shadowDraw ? 0.1 : 0) + (ironRam ? 0.16 : 0)
      + (ironSlam ? 0.08 : 0) + (bastionSlam ? 0.12 : 0) + (bastionDash ? 0.14 : 0) + (seal ? 0.06 : 0));
    ctx.scale((f.facing || 1) * SIZE, SIZE);
    ctx.globalAlpha = ghost ? (f.ghostAlpha || 0.22) : f.invuln > 0 && f.anim % 4 < 2 ? 0.45 : 1;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const bodyColor = f.hitFlash > 0 && !ghost ? "#ffffff" : d.color;
    const hipY = -36 + bob + (shadowDraw ? 10 : 0) + (shadowSlash ? 4 : 0) + (ironRam ? 2 : 0) + (bastionSlam ? 6 : 0) + (bastionDash ? 2 : 0);
    const shoulderY = -62 + bob - upper * 6;
    const headY = -80 + bob - upper * 8;
    const jumpTuck = f.state === "jump" ? 10 : 0;
    const left = walk ? walkLeg(cycle, 0) : null;
    const right = walk ? walkLeg(cycle, 0.5) : null;

    let lKneeX = left ? left.kneeX : spin * 18;
    let lKneeY = left ? left.kneeY + bob : hipY + 16 + jumpTuck;
    let lFootX = left ? left.x : spin * 28;
    let lFootY = left ? left.y : jumpTuck * 0.4 - 2;
    let rKneeX = right ? right.kneeX : 8 + spin * -10;
    let rKneeY = right ? right.kneeY + bob : hipY + 16 + jumpTuck;
    let rFootX = right ? right.x : 12;
    let rFootY = right ? right.y : -2 + jumpTuck * 0.4;
    if (!walk) {
      if (shadowDraw) {
        lKneeX = -4; lKneeY = hipY + 20; lFootX = -10; lFootY = 0;
        rKneeX = 12; rKneeY = hipY + 18; rFootX = 16; rFootY = -2;
      } else if (shadowSlash) {
        lKneeX = -6; lKneeY = hipY + 14; lFootX = -12; lFootY = -2;
        rKneeX = 16; rKneeY = hipY + 12; rFootX = 24; rFootY = -2;
      } else if (seal) {
        lKneeX = -2; lFootX = -8; rKneeX = 14; rFootX = 22;
      } else if (ironRam || bastionDash) {
        lKneeX = -2; rKneeX = 14; lFootX = -6; rFootX = 20;
      } else if (ironSlam || bastionSlam) {
        lFootY = -10; lKneeY = hipY + 10;
      } else if (bastionAim) {
        lFootX = -8; rFootX = 14;
      } else if (bastionWind) {
        lFootY = -8; rFootX = 10;
      }
    }

    const armWave = walk ? Math.cos(cycle * Math.PI * 2) : 0;
    let armFwd;
    let armFwdY;
    let armBack;
    let armBackY;
    if (walk) {
      armFwd = 8 + armWave * 16;
      armFwdY = shoulderY + 14 - armWave * 7;
      armBack = -10 - armWave * 16;
      armBackY = shoulderY + 16 + armWave * 7;
    } else if (shadowDraw) {
      armFwd = 26; armFwdY = shoulderY + 16;
      armBack = 8; armBackY = shoulderY + 20;
    } else if (shadowSlash) {
      armFwd = 38; armFwdY = shoulderY + 12;
      armBack = -22; armBackY = shoulderY - 10;
    } else if (seal) {
      armFwd = 34; armFwdY = shoulderY + 6;
      armBack = 22; armBackY = shoulderY + 8;
    } else if (ironShow) {
      armFwd = 30; armFwdY = shoulderY - 2;
      armBack = -30; armBackY = shoulderY - 2;
    } else if (ironRam) {
      armFwd = 34; armFwdY = shoulderY + 8;
      armBack = 26; armBackY = shoulderY + 12;
    } else if (ironSlam) {
      armFwd = 16; armFwdY = shoulderY + 30;
      armBack = -12; armBackY = shoulderY + 28;
    } else if (bastionWind) {
      armFwd = 10; armFwdY = shoulderY - 22;
      armBack = -16; armBackY = shoulderY - 18;
    } else if (bastionSlam) {
      armFwd = 18; armFwdY = shoulderY + 28;
      armBack = -10; armBackY = shoulderY + 24;
    } else if (bastionAim) {
      armFwd = 36; armFwdY = shoulderY + 2;
      armBack = 22; armBackY = shoulderY + 6;
    } else if (bastionDash) {
      armFwd = 32; armFwdY = shoulderY + 6;
      armBack = 24; armBackY = shoulderY + 10;
    } else if (scriptCast) {
      armFwd = 36; armFwdY = shoulderY - 12;
      armBack = -36; armBackY = shoulderY - 12;
    } else {
      armFwd = 16 + punchT * 42 + skillPunch * 36 + upper * 20;
      armFwdY = shoulderY + 16 - punchT * 12 - upper * 36;
      armBack = -16;
      armBackY = shoulderY + 18;
    }
    const elbowFwdX = walk ? armFwd * 0.45 : armFwd * 0.5;
    const elbowFwdY = walk ? shoulderY + 10 : (shoulderY + 4 + armFwdY) * 0.5;
    const elbowBackX = walk ? armBack * 0.45 : armBack * 0.5;
    const elbowBackY = walk ? shoulderY + 12 : (shoulderY + 4 + armBackY) * 0.5;
    const headX = upper * -2;

    function strokeStick(width, color, blur) {
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = width;
      ctx.shadowColor = blur ? color : "transparent";
      ctx.shadowBlur = blur;
      ctx.beginPath();
      ctx.moveTo(0, hipY);
      ctx.lineTo(lKneeX, lKneeY);
      ctx.lineTo(lFootX, lFootY);
      ctx.moveTo(0, hipY);
      ctx.lineTo(rKneeX, rKneeY);
      ctx.lineTo(rFootX, rFootY);
      ctx.moveTo(0, hipY);
      ctx.lineTo(upper * -4, shoulderY);
      ctx.moveTo(0, shoulderY + 4);
      ctx.lineTo(elbowFwdX, elbowFwdY);
      ctx.lineTo(armFwd, armFwdY);
      ctx.moveTo(0, shoulderY + 4);
      ctx.lineTo(elbowBackX, elbowBackY);
      ctx.lineTo(armBack, armBackY);
      ctx.stroke();
      if (!hasPortrait(d)) {
        ctx.beginPath();
        ctx.arc(headX, headY, 16.5, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    strokeStick(d.thick + 3.4, "rgba(12, 16, 28, 0.78)", 0);
    strokeStick(d.thick, bodyColor, ghost ? 0 : 10);

    ctx.shadowBlur = 0;

        g.addColorStop(0, "rgba(124, 45, 18, 0.2)");
        g.addColorStop(0.35, "#ea580c");
        g.addColorStop(0.7, "#fb923c");
        g.addColorStop(1, "#fff7ed");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(-42, 2);
        ctx.quadraticCurveTo(-8, -56, 18, -28);
        ctx.quadraticCurveTo(6, -16, 44, -6);
        ctx.lineTo(38, 2);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "rgba(255, 247, 237, 0.7)";
        ctx.beginPath();
        ctx.moveTo(-10, 0);
        ctx.quadraticCurveTo(4, -34, 22, -8);
        ctx.quadraticCurveTo(8, -4, 16, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        ctx.save();
        drawMusicNote(ctx, p.x + dir * 18, GROUND - 58, 1.8, "#fff7ed", 0.9);
        drawMusicNote(ctx, p.x - dir * 10, GROUND - 36, 1.25, "#fb923c", 0.75);
      } else if (p.type === "note") {
        const dir = Math.sign(p.vx) || 1;
        const aura = ctx.createRadialGradient(p.x, p.y, 4, p.x, p.y, 52);
        aura.addColorStop(0, "rgba(255,247,237,0.7)");
        aura.addColorStop(0.45, "rgba(251,146,60,0.4)");
        aura.addColorStop(1, "rgba(251,146,60,0)");
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 52, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fdba74";
        ctx.shadowColor = "#fb923c";
        ctx.shadowBlur = 18;
        ctx.lineWidth = 2.6;
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 28 + (p.life % 8), 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
        drawMusicNote(ctx, p.x, p.y, 2.35, "#fb923c", 1);
        drawMusicNote(ctx, p.x - dir * 22, p.y + 16, 1.15, "#fff7ed", 0.7);
      } else if (p.type === "bass") {
        const dir = Math.sign(p.vx) || 1;
        ctx.translate(p.x, p.y);
        ctx.scale(dir, 1);
        ctx.shadowColor = "#22d3ee";
        ctx.shadowBlur = 18;
        ctx.fillStyle = "#67e8f9";
        ctx.beginPath();
        ctx.moveTo(-10, 0);
        ctx.lineTo(4, -12);
        ctx.lineTo(16, 0);
        ctx.lineTo(4, 12);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#e0f2fe";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "rgba(224,242,254,0.85)";
        ctx.fillRect(-4, -16, 3, 32);
        ctx.fillRect(2, -12, 3, 24);
      } else {
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 16;
        const g = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, p.r + 6);
        g.addColorStop(0, "#fff7ed");
        g.addColorStop(0.5, p.color);
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r + 6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawHazards() {
    for (const h of hazards) {
      ctx.save();
      if (h.type === "meteor") {
        ctx.shadowColor = h.color;
        ctx.shadowBlur = 36;
        const trail = ctx.createLinearGradient(h.x, h.y - 90, h.x, h.y + 18);
        trail.addColorStop(0, "rgba(255,247,237,0)");
        trail.addColorStop(0.55, "rgba(251,146,60,0.45)");
        trail.addColorStop(1, "rgba(234,88,12,0.9)");
        ctx.fillStyle = trail;
        ctx.beginPath();
        ctx.moveTo(h.x - 22, h.y);
        ctx.lineTo(h.x, h.y - 96);
        ctx.lineTo(h.x + 22, h.y);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#fff7ed";
        ctx.beginPath();
        ctx.arc(h.x, h.y, 32, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = h.color;
        ctx.beginPath();
        ctx.arc(h.x, h.y, 20, 0, Math.PI * 2);
        ctx.fill();
        drawMusicNote(ctx, h.x + 18, h.y - 28, 1.7, "#fff7ed", 0.95);
      } else if (h.type === "skillShock") {
        const telegraph = h.delay > 0;
        ctx.globalAlpha = telegraph ? 0.35 : Math.max(0.12, h.life / 12);
        ctx.strokeStyle = h.color;
        ctx.fillStyle = telegraph ? "rgba(255,255,255,0.07)" : h.color;
        ctx.shadowColor = h.color;
        ctx.shadowBlur = telegraph ? 12 : 28;
        ctx.lineWidth = telegraph ? 4 : 9;
        if (telegraph) {
          const size = h.radius * (0.72 + (h.delay % 6) * 0.035);
          ctx.save();
          ctx.translate(h.x, GROUND - 6);
          ctx.rotate(Math.PI / 4);
          ctx.strokeRect(-size * 0.5, -size * 0.5, size, size);
          ctx.restore();
        } else {
          const spread = h.radius + (12 - h.life) * 3;
          ctx.beginPath();
          ctx.moveTo(h.x - spread, GROUND);
          ctx.lineTo(h.x - spread * 0.42, GROUND - h.radius * 0.7);
          ctx.lineTo(h.x - spread * 0.12, GROUND - h.radius * 1.7);
          ctx.lineTo(h.x + spread * 0.16, GROUND - h.radius * 0.85);
          ctx.lineTo(h.x + spread * 0.5, GROUND - h.radius * 1.25);
          ctx.lineTo(h.x + spread, GROUND);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
      } else if (h.type === "pillar") {
        const rise = Math.min(1, (16 - h.life) / 3);
        const hgt = 150 * rise;
        ctx.globalAlpha = Math.max(0.2, h.life / 16);
        const g = ctx.createLinearGradient(h.x, GROUND, h.x, GROUND - hgt);
        g.addColorStop(0, "rgba(8,47,73,0.15)");
        g.addColorStop(0.35, "rgba(34,211,238,0.55)");
        g.addColorStop(1, "rgba(224,242,254,0.9)");
        ctx.fillStyle = g;
        ctx.shadowColor = "#22d3ee";
        ctx.shadowBlur = 24;
        ctx.fillRect(h.x - 16, GROUND - hgt, 32, hgt);
        ctx.strokeStyle = "#e0f2fe";
        ctx.lineWidth = 2;
        ctx.strokeRect(h.x - 16, GROUND - hgt, 32, hgt);
      } else if (h.type === "boom" || h.type === "shock") {
        const pyroBoom = h.type === "boom" && (h.color === "#fb923c" || (h.owner && h.owner.id === "pyro"));
        ctx.globalAlpha = Math.max(0.15, h.life / 16);
        ctx.strokeStyle = h.color;
        ctx.shadowColor = h.color === "#335566" ? "#7dd3fc" : h.color;
        ctx.shadowBlur = pyroBoom ? 32 : 18;
        ctx.lineWidth = pyroBoom ? 12 : 6;
        ctx.beginPath();
        ctx.arc(h.x, GROUND, (pyroBoom ? 78 : 40) + (16 - h.life) * (pyroBoom ? 14 : 8), Math.PI, 0);
        ctx.stroke();
        if (pyroBoom) {
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.arc(h.x, GROUND, 42 + (16 - h.life) * 10, Math.PI, 0);
          ctx.stroke();
          ctx.fillStyle = "rgba(251,146,60,0.18)";
          ctx.beginPath();
          ctx.ellipse(h.x, GROUND - 8, 110 + (14 - h.life) * 8, 48, 0, 0, Math.PI * 2);
          ctx.fill();
          drawMusicNote(ctx, h.x - 36, GROUND - 52, 2.1, "#fff7ed", 0.9);
          drawMusicNote(ctx, h.x + 40, GROUND - 40, 1.6, "#fb923c", 0.85);
        }
        if (h.type === "shock") {
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(h.x, GROUND, 18 + (16 - h.life) * 11, Math.PI, 0);
          ctx.stroke();
          ctx.strokeStyle = "#e0f2fe";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(h.x - 70, GROUND);
          ctx.lineTo(h.x - 40, GROUND - 18);
          ctx.lineTo(h.x - 8, GROUND);
          ctx.lineTo(h.x + 22, GROUND - 14);
          ctx.lineTo(h.x + 64, GROUND);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
  }

  function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i -= 1) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12;
      p.life -= 1;
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
      ctx.globalAlpha = 1;
      if (p.life <= 0) removeAtSwap(particles, i);
    }
    for (let i = afterimages.length - 1; i >= 0; i -= 1) {
      const a = afterimages[i];
      a.life -= 1;
      drawFighter(a, true);
      if (a.life <= 0) removeAtSwap(afterimages, i);
    }
  }

  function drawImpactRings() {
    for (let i = impactRings.length - 1; i >= 0; i -= 1) {
      const ring = impactRings[i];
      const progress = 1 - ring.life / ring.max;
      ctx.save();
      ctx.globalAlpha = Math.max(0, ring.life / ring.max);
      ctx.strokeStyle = ring.color;
      ctx.shadowColor = ring.color;
      ctx.shadowBlur = 16;
      ctx.lineWidth = Math.max(2, 7 * (1 - progress));
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, ring.radius + progress * ring.speed * ring.max, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      ring.life -= 1;
      if (ring.life <= 0) removeAtSwap(impactRings, i);
    }
  }

  function drawCombatFeedback() {
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineWidth = 4;
    ctx.strokeStyle = "rgba(0,0,0,0.65)";
    for (let i = combatFeedback.length - 1; i >= 0; i -= 1) {
      const item = combatFeedback[i];
      item.y += item.vy;
      item.life -= 1;
      ctx.font = `900 ${item.size || 20}px Segoe UI, Microsoft YaHei, sans-serif`;
      ctx.globalAlpha = Math.min(1, item.life / Math.min(18, item.max));
      ctx.strokeText(item.text, item.x, item.y);
      ctx.fillStyle = item.color;
      ctx.fillText(item.text, item.x, item.y);
      if (item.life <= 0) removeAtSwap(combatFeedback, i);
    }
    ctx.restore();
  }

  function drawIntro() {
    if (intro <= 0 && !freezeText) return;
    if (intro > 0) {
      ctx.fillStyle = "rgba(80, 40, 20, 0.18)";
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }
    if (freezeText) {
      ctx.fillStyle = "#f8fafc";
      ctx.textAlign = "center";
      ctx.font = "800 72px Segoe UI, Microsoft YaHei, sans-serif";
      ctx.fillText(freezeText, CANVAS_W / 2, 280);
    }
  }

  function render() {
    drawCachedBackground();
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.86;
      if (shake < 0.4) shake = 0;
    }
    drawHazards();
    drawParticles();
    drawImpactRings();
    drawProjectiles();
    drawFighter(cpu);
    drawFighter(player);
    drawSkillFx(cpu);
    drawSkillFx(player);
    drawCombatFeedback();
    drawIntro();
    drawBattleChrome();
    ctx.restore();
  }

  function cdLabel(frames) {
    const s = frames / 60;
    return s >= 1 ? String(Math.ceil(s)) : s.toFixed(1);
  }

  const actionButtonCache = Object.create(null);
  function actBtn(slot) {
    if (!actionButtonCache[slot]) {
      actionButtonCache[slot] = document.querySelector(`.act-btn[data-slot="${slot}"]`);
    }
    return actionButtonCache[slot];
  }

  function drawBattleChrome() {
    ctx.save();
    ctx.textAlign = "center";
    ctx.lineJoin = "round";
    const t = String(Math.max(0, Math.ceil(timeLeft))).padStart(2, "0");
    ctx.font = "800 40px Segoe UI, Microsoft YaHei, sans-serif";
    ctx.lineWidth = 6;
    ctx.strokeStyle = "rgba(0,0,0,0.4)";
    ctx.fillStyle = "#fff";
    ctx.strokeText(t, CANVAS_W / 2, 46);
    ctx.fillText(t, CANVAS_W / 2, 46);
    if (matchMode !== "pve") {
      ctx.font = "800 16px Segoe UI, Microsoft YaHei, sans-serif";
      ctx.fillStyle = "#fde68a";
      ctx.strokeText(matchMode === "cycle" ? "循环观战" : "电脑观战", CANVAS_W / 2, 78);
      ctx.fillText(matchMode === "cycle" ? "循环观战" : "电脑观战", CANVAS_W / 2, 78);
    }
    if (comboCount >= 2 && comboTimer > 0) {
      ctx.font = "800 20px Segoe UI, Microsoft YaHei, sans-serif";
      ctx.fillStyle = "#fbbf24";
      const cy = matchMode !== "pve" ? 102 : 74;
      ctx.strokeText(`COMBO ${comboCount}`, CANVAS_W / 2, cy);
      ctx.fillText(`COMBO ${comboCount}`, CANVAS_W / 2, cy);
    }
    ctx.restore();
  }

  function paintAct(btn, ready, remain, total, charge) {
    if (!btn) return;
    if (btn._paintReady !== ready) {
      btn.classList.toggle("ready", ready);
      btn.classList.toggle("cooling", !ready);
      btn._paintReady = ready;
    }
    const mask = btn._cdMask || (btn._cdMask = btn.querySelector(".cd-mask"));
    const num = btn._cdNum || (btn._cdNum = btn.querySelector(".cd-num"));
    let height;
    let label;
    if (charge) {
      const filled = Math.max(0, 1 - remain / total);
      height = `${Math.round(filled * 100)}%`;
      label = "";
    } else {
      height = ready ? "0%" : `${Math.round(Math.max(0, remain / total) * 100)}%`;
      label = ready ? "" : cdLabel(remain);
    }
    if (mask && mask._paintHeight !== height) {
      mask.style.height = height;
      mask._paintHeight = height;
    }
    if (num && num._paintLabel !== label) {
      num.textContent = label;
      num._paintLabel = label;
    }
  }

  function syncActionNames(def) {
    const setName = (slot, name) => {
      const el = actBtn(slot);
      if (el) el.querySelector(".sname").textContent = name;
    };
    setName("s0", def.s0.name);
    setName("s1", def.s1.name);
    setName("s2", def.s2.name);
    setName("ult", def.ult.name);
    setName("punch", def.punch.name || "普攻");
  }

  function paintActionButtons(fighter) {
    if (!fighter) return;
    paintAct(actBtn("s0"), fighter.cd0 <= 0, fighter.cd0, fighter.def.s0.cd);
    paintAct(actBtn("s1"), fighter.cd1 <= 0, fighter.cd1, fighter.def.s1.cd);
    paintAct(actBtn("s2"), fighter.cd2 <= 0, fighter.cd2, fighter.def.s2.cd);
    const ultReady = fighter.mp >= fighter.def.ult.cost;
    paintAct(actBtn("ult"), ultReady, fighter.maxMp - fighter.mp, fighter.maxMp, true);
    const punch = actBtn("punch");
    if (punch && !punch._paintReady) {
      punch.classList.add("ready");
      punch._paintReady = true;
    }
  }

  function updateHud() {
    paintActionButtons(player);
  }

  function thinkAs(me, opp) {
    const savedPlayer = player;
    const savedCpu = cpu;
    player = opp;
    cpu = me;
    const input = cpuThink();
    player = savedPlayer;
    cpu = savedCpu;
    return input;
  }

  function buildCyclePairs() {
    const ids = CHARACTERS.map((c) => c.id);
    const pairs = [];
    for (let i = 0; i < ids.length; i += 1) {
      for (let j = 0; j < ids.length; j += 1) {
        if (i !== j) pairs.push([ids[i], ids[j]]);
      }
    }
    return pairs;
  }

  function setSpectateControls(on) {
    const pad = document.getElementById("touch-pad");
    const pc = document.getElementById("pc-controls");
    if (pad) pad.style.display = on ? "none" : "";
    if (pc) pc.style.display = on ? "none" : "";
  }

  function finish(winner) {
    if (ended) return;
    ended = true;
    running = false;
    freezeText = "";
    ui.result.classList.remove("hidden");
    const spectate = matchMode !== "pve";
    if (winner === "player") {
      ui.resultKicker.textContent = spectate ? "电脑对战" : "K.O.";
      ui.resultTitle.textContent = spectate ? "左方胜" : "胜利";
      ui.resultSub.textContent = `${player.def.name} 击败了 ${cpu.def.name}`;
      beep(523, 0.12, "square", 0.06);
      setTimeout(() => beep(784, 0.2, "square", 0.06), 120);
    } else if (winner === "cpu") {
      ui.resultKicker.textContent = spectate ? "电脑对战" : "K.O.";
      ui.resultTitle.textContent = spectate ? "右方胜" : "敗北";
      ui.resultSub.textContent = `${cpu.def.name} 击败了 ${player.def.name}`;
      beep(180, 0.3, "sawtooth", 0.05);
    } else {
      ui.resultKicker.textContent = "TIME UP";
      ui.resultTitle.textContent = "平局";
      ui.resultSub.textContent = "时间耗尽，双方仍站立";
    }
    if (matchMode === "cycle" && cyclePairs.length) {
      const next = cyclePairs[(cycleIndex + 1) % cyclePairs.length];
      const na = CHARACTERS.find((c) => c.id === next[0]);
      const nb = CHARACTERS.find((c) => c.id === next[1]);
      ui.resultSub.textContent = `${ui.resultSub.textContent} · 下一场 ${na.name} vs ${nb.name}`;
      const gen = battleGen;
      setTimeout(() => {
        if (battleGen !== gen || matchMode !== "cycle") return;
        cycleIndex = (cycleIndex + 1) % cyclePairs.length;
        startBattle("cycle");
      }, 1600);
    }
  }

  function stepFrame() {
    bgPulse += 1;
    if (hitstop > 0) {
      hitstop -= 1;
      return;
    }
    if (intro > 0) {
      intro -= FIXED_FRAME_MS;
      if (intro > 1800) freezeText = "3";
      else if (intro > 1100) freezeText = "2";
      else if (intro > 400) freezeText = "1";
      else freezeText = "FIGHT";
      if (intro <= 0) freezeText = "";
      Object.keys(justPressed).forEach((code) => { justPressed[code] = false; });
      return;
    }

    timeLeft -= FIXED_FRAME_MS / 1000;
    if (comboTimer > 0) comboTimer -= 1;
    else comboCount = 0;

    player.update(matchMode === "pve" ? playerInput() : thinkAs(player, cpu), cpu);
    cpu.update(matchMode === "pve" ? cpuThink() : thinkAs(cpu, player), player);
    pushApart();
    resolveHits();

    if (player.dead || cpu.dead) {
      koDelay += 1;
      if (koDelay > 55) {
        if (player.dead && cpu.dead) finish("draw");
        else if (player.dead) finish("cpu");
        else finish("player");
      }
    } else if (timeLeft <= 0) {
      if (player.hp > cpu.hp) finish("player");
      else if (cpu.hp > player.hp) finish("cpu");
      else finish("draw");
    }
  }

  function tick(ts) {
    if (!running) return;
    const elapsed = Math.min(50, ts - last || FIXED_FRAME_MS);
    last = ts;
    if (paused) {
      frameAccumulator = 0;
      requestAnimationFrame(tick);
      return;
    }

    frameAccumulator += elapsed;
    let steps = 0;
    while (frameAccumulator >= FIXED_FRAME_MS && steps < MAX_CATCHUP_STEPS && running) {
      stepFrame();
      frameAccumulator -= FIXED_FRAME_MS;
      steps += 1;
    }
    if (steps > 0) {
      render();
      updateHud();
    }
    if (running) requestAnimationFrame(tick);
  }

  function startBattle(mode) {
    if (typeof mode === "string") matchMode = mode;
    battleGen += 1;
    if (matchMode === "cycle") {
      if (!cyclePairs.length) cyclePairs = buildCyclePairs();
      const pair = cyclePairs[cycleIndex % cyclePairs.length];
      selection.player = pair[0];
      selection.cpu = pair[1];
    }
    const pDef = CHARACTERS.find((c) => c.id === selection.player);
    const cDef = CHARACTERS.find((c) => c.id === selection.cpu);
    player = new Fighter(pDef, 280, 1, matchMode !== "pve");
    cpu = new Fighter(cDef, 1000, -1, true);
    particles.length = 0;
    projectiles.length = 0;
    afterimages.length = 0;
    hazards.length = 0;
    combatFeedback.length = 0;
    impactRings.length = 0;
    Object.keys(justPressed).forEach((code) => { justPressed[code] = false; });
    timeLeft = 99;
    comboCount = 0;
    comboTimer = 0;
    shake = 0;
    hitstop = 0;
    intro = 2500;
    freezeText = "3";
    koDelay = 0;
    ended = false;
    paused = false;
    running = true;
    last = performance.now();
    frameAccumulator = 0;
    cachedBackgroundPulse = -Infinity;
    syncActionNames(pDef);
    setSpectateControls(matchMode !== "pve");
    ui.menu.classList.add("hidden");
    ui.battle.classList.remove("hidden");
    ui.pause.classList.add("hidden");
    ui.result.classList.add("hidden");
    beep(440, 0.08, "square", 0.05);
    forceLandscape();
    requestAnimationFrame(() => {
      fitCanvas();
      requestAnimationFrame(tick);
    });
  }

  function backToMenu() {
    battleGen += 1;
    matchMode = "pve";
    running = false;
    paused = false;
    ended = false;
    setSpectateControls(false);
    ui.battle.classList.add("hidden");
    ui.menu.classList.remove("hidden");
    ui.pause.classList.add("hidden");
    ui.result.classList.add("hidden");
  }

  function cardHtml(c) {
    const src = portraitStore[c.id];
    if (src) return `<img class="cface" alt="${c.name}" src="${src}"><div class="cname">${c.name}</div>`;
    return `<div class="cface-empty"></div><div class="cname">${c.name}</div>`;
  }

  function previewHtml(c) {
    const cd = (n) => (n / 60).toFixed(1);
    const jumpNote = c.airJumps > 0 ? " · <b>二段跳</b>" : "";
    const text = (skill) => (skillDetail ? skill.detail : skill.hint);
    const line = (skill, cdText, extra) =>
      `<div class="skill-line${extra || ""}"><b>${skill.name}</b><span class="scd">${cdText}</span><span class="phint">${text(skill)}</span></div>`;
    const punch = c.punch;
    const stats = skillDetail
      ? `生命 <b>${c.hp}</b> · 移速 <b>${c.speed.toFixed(1)}</b> · 跳跃 <b>${c.jump}</b>${jumpNote}<br>${punch.name || "普攻"} 伤害 <b>${punch.dmg}</b> · 击退 <b>${punch.kb}</b> · 硬直 <b>${(punch.stun / 60).toFixed(2)}秒</b> · 出招/判定/后摇 <b>${(punch.startup / 60).toFixed(2)}/${(punch.active / 60).toFixed(2)}/${(punch.recover / 60).toFixed(2)}秒</b> · 距离 <b>${Math.round(punch.reach * SIZE)}</b>`
      : `生命 <b>${c.hp}</b> · 移速 <b>${c.speed.toFixed(1)}</b> · 拳伤 <b>${punch.dmg}</b> · 击退 <b>${punch.kb}</b>${jumpNote}`;
    return `<div class="preview-head"><strong style="color:${c.color}">${c.name}</strong><span class="ptag">${c.tag}</span></div>
      <div class="pstats">${stats}</div>
      <div class="pskills">
      ${line(c.s0, `${cd(c.s0.cd)}s`)}
      ${line(c.s1, `${cd(c.s1.cd)}s`)}
      ${line(c.s2, `${cd(c.s2.cd)}s`)}
      ${line(c.ult, `${c.ult.cost}蓝`, " ult")}
      </div>`;
  }

  function renderMenu() {
    ui.playerCards.innerHTML = "";
    ui.cpuCards.innerHTML = "";
    CHARACTERS.forEach((c) => {
      const p = document.createElement("button");
      p.className = `card${selection.player === c.id ? " selected" : ""}`;
      p.style.setProperty("--card-color", c.color);
      p.innerHTML = cardHtml(c);
      p.onclick = () => { selection.player = c.id; beep(520, 0.05, "square", 0.04); renderMenu(); };
      ui.playerCards.appendChild(p);
      const e = document.createElement("button");
      e.className = `card${selection.cpu === c.id ? " selected" : ""}`;
      e.style.setProperty("--card-color", c.color);
      e.innerHTML = cardHtml(c);
      e.onclick = () => { selection.cpu = c.id; beep(400, 0.05, "square", 0.04); renderMenu(); };
      ui.cpuCards.appendChild(e);
    });
    ui.playerPreview.classList.toggle("detailed", skillDetail);
    ui.cpuPreview.classList.toggle("detailed", skillDetail);
    ui.playerPreview.innerHTML = previewHtml(CHARACTERS.find((c) => c.id === selection.player));
    ui.cpuPreview.innerHTML = previewHtml(CHARACTERS.find((c) => c.id === selection.cpu));
    if (ui.descToggle) {
      ui.descToggle.classList.toggle("on", skillDetail);
      ui.descToggle.textContent = skillDetail ? "简略描述" : "详细数值";
    }
    ui.diffBtns.innerHTML = "";
    Object.entries(DIFFICULTIES).forEach(([id, d]) => {
      const b = document.createElement("button");
      b.textContent = d.label;
      b.className = selection.difficulty === id ? "selected" : "";
      b.onclick = () => { selection.difficulty = id; beep(280, 0.04, "triangle", 0.04); renderMenu(); };
      ui.diffBtns.appendChild(b);
    });
  }

  function forceLandscape() {
    const app = document.getElementById("app");
    const vv = window.visualViewport;
    const vw = Math.round(vv ? vv.width : window.innerWidth);
    const vh = Math.round(vv ? vv.height : window.innerHeight);
    if (vh > vw) {
      app.style.width = `${vh}px`;
      app.style.height = `${vw}px`;
      app.style.top = "0";
      app.style.left = "0";
      app.style.transform = `translate(${vw}px, 0) rotate(90deg)`;
    } else {
      app.style.width = `${vw}px`;
      app.style.height = `${vh}px`;
      app.style.top = "0";
      app.style.left = "0";
      app.style.transform = "none";
    }
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("landscape").catch(() => {});
    }
    fitCanvas();
  }

  window.addEventListener("resize", forceLandscape);
  window.addEventListener("orientationchange", forceLandscape);
  if (window.visualViewport) {
    visualViewport.addEventListener("resize", forceLandscape);
    visualViewport.addEventListener("scroll", forceLandscape);
  }
  window.addEventListener("keydown", (e) => {
    if (!keys[e.code]) justPressed[e.code] = true;
    keys[e.code] = true;
    if (["Space", "ArrowUp", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
    if (e.code === "Escape" && running && !ended) {
      paused = !paused;
      ui.pause.classList.toggle("hidden", !paused);
    }
    if (audio.ctx && audio.ctx.state === "suspended") audio.ctx.resume();
  });
  window.addEventListener("keyup", (e) => { keys[e.code] = false; });
  window.addEventListener("blur", () => {
    Object.keys(keys).forEach((code) => { keys[code] = false; });
    Object.keys(justPressed).forEach((code) => { justPressed[code] = false; });
  });

  function bindTouchPad() {
    const pad = document.getElementById("touch-pad");
    const zone = document.getElementById("stick-zone");
    const stick = document.getElementById("stick");
    const knob = document.getElementById("stick-knob");
    if (!pad || !zone || !stick || !knob) return;

    const RADIUS = 48;
    const DEFAULT = { x: 88, y: null };
    let stickTouch = null;
    let origin = { x: DEFAULT.x, y: 0 };
    let didJump = false;

    function appPoint(clientX, clientY) {
      const vv = window.visualViewport;
      const vw = Math.round(vv ? vv.width : window.innerWidth);
      const vh = Math.round(vv ? vv.height : window.innerHeight);
      if (vh > vw) return { x: clientY, y: vw - clientX };
      return { x: clientX, y: clientY };
    }

    function zonePoint(clientX, clientY) {
      const p = appPoint(clientX, clientY);
      return { x: p.x - zone.offsetLeft, y: p.y - zone.offsetTop };
    }

    function resetStick() {
      stick.style.left = `${DEFAULT.x}px`;
      stick.style.top = "auto";
      stick.style.bottom = "72px";
      stick.style.transform = "translate(-50%, 50%)";
      knob.style.transform = "translate(0, 0)";
      keys.KeyA = false;
      keys.KeyD = false;
      stickTouch = null;
      didJump = false;
    }

    function applyStick(dx, dy) {
      const len = Math.hypot(dx, dy) || 1;
      const clamped = Math.min(len, RADIUS);
      const nx = (dx / len) * clamped;
      const ny = (dy / len) * clamped;
      knob.style.transform = `translate(${nx}px, ${ny}px)`;
      keys.KeyA = nx < -14;
      keys.KeyD = nx > 14;
      if (ny < -28 && !didJump) {
        justPressed.KeyW = true;
        didJump = true;
      }
      if (ny > -12) didJump = false;
    }

    function onStickStart(clientX, clientY, id) {
      const p = zonePoint(clientX, clientY);
      stickTouch = id;
      origin = p;
      stick.style.left = `${p.x}px`;
      stick.style.top = `${p.y}px`;
      stick.style.bottom = "auto";
      stick.style.transform = "translate(-50%, -50%)";
      knob.style.transform = "translate(0, 0)";
      didJump = false;
      keys.KeyA = false;
      keys.KeyD = false;
      if (audio.ctx && audio.ctx.state === "suspended") audio.ctx.resume();
    }

    function onStickMove(clientX, clientY) {
      const p = zonePoint(clientX, clientY);
      applyStick(p.x - origin.x, p.y - origin.y);
    }

    zone.addEventListener("touchstart", (e) => {
      if (stickTouch !== null) return;
      const t = e.changedTouches[0];
      e.preventDefault();
      onStickStart(t.clientX, t.clientY, t.identifier);
    }, { passive: false });

    window.addEventListener("touchmove", (e) => {
      if (stickTouch === null) return;
      for (let i = 0; i < e.changedTouches.length; i += 1) {
        const t = e.changedTouches[i];
        if (t.identifier === stickTouch) {
          e.preventDefault();
          onStickMove(t.clientX, t.clientY);
          break;
        }
      }
    }, { passive: false });

    const endStick = (e) => {
      if (stickTouch === null) return;
      for (let i = 0; i < e.changedTouches.length; i += 1) {
        if (e.changedTouches[i].identifier === stickTouch) {
          resetStick();
          break;
        }
      }
    };
    window.addEventListener("touchend", endStick);
    window.addEventListener("touchcancel", endStick);

    zone.addEventListener("mousedown", (e) => {
      e.preventDefault();
      onStickStart(e.clientX, e.clientY, "mouse");
    });
    window.addEventListener("mousemove", (e) => {
      if (stickTouch !== "mouse") return;
      onStickMove(e.clientX, e.clientY);
    });
    window.addEventListener("mouseup", () => {
      if (stickTouch === "mouse") resetStick();
    });

    pad.querySelectorAll("[data-press]").forEach((btn) => {
      const code = btn.getAttribute("data-press");
      const fire = (e) => {
        e.preventDefault();
        e.stopPropagation();
        justPressed[code] = true;
        if (audio.ctx && audio.ctx.state === "suspended") audio.ctx.resume();
      };
      btn.addEventListener("touchstart", fire, { passive: false });
      btn.addEventListener("mousedown", fire);
    });
    pad.addEventListener("contextmenu", (e) => e.preventDefault());
    resetStick();
  }

  bindTouchPad();
  forceLandscape();
  loadPortraits().then(() => renderMenu());

  ui.startBtn.addEventListener("click", () => startBattle("pve"));
  if (ui.watchBtn) ui.watchBtn.addEventListener("click", () => startBattle("watch"));
  if (ui.cycleBtn) ui.cycleBtn.addEventListener("click", () => {
    cyclePairs = buildCyclePairs();
    cycleIndex = 0;
    startBattle("cycle");
  });
  ui.descToggle.addEventListener("click", () => {
    skillDetail = !skillDetail;
    beep(skillDetail ? 520 : 360, 0.04, "square", 0.04);
    renderMenu();
  });
  ui.pauseBtn.addEventListener("click", () => {
    if (!running || ended) return;
    paused = !paused;
    ui.pause.classList.toggle("hidden", !paused);
  });
  ui.pause.querySelector("[data-resume]").addEventListener("click", () => {
    paused = false;
    ui.pause.classList.add("hidden");
  });
  ui.pause.querySelector("[data-menu]").addEventListener("click", backToMenu);
  ui.result.querySelector("[data-rematch]").addEventListener("click", startBattle);
  ui.result.querySelector("[data-menu]").addEventListener("click", backToMenu);

  renderMenu();
})();

</script>
</body>
</html>
